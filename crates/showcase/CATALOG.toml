[[item]]
id       = "tabs"
name     = "Tabs"
group    = "structure"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "tabs"
types    = ["Tabs"]
notes    = "When the strip overflows, three-cell arrow buttons appear at both ends. Hover lights them with the pillar, a press flashes and scrolls by one tab, and an arrow that can go no further sinks into the surface. badge(index, count) puts a count one space after a tab's name, named and toned like the TabRail badge (tab-badge, a step quieter than the name): zero shows nothing and takes no room, so an application passes its count as it is, and above 99 it reads 99+ like a Badge count. The count is part of the tab's width, so a narrow tab cuts its name first and keeps the count; like the rail's badge it stays put while the name slides, and a hidden tab carries its count into the overflow menu."
notes-tr = "Şerit taştığında iki uçta üç hücrelik ok düğmeleri belirir. Hover onları çubukla aydınlatır, basış parlayıp bir sekme kaydırır, daha ileri gidemeyen ok zemine iner. badge(sıra, sayı) bir sekmenin adından bir boşluk sonra bir sayı koyar; adı ve tonu TabRail rozetiyle aynıdır (tab-badge, addan bir ton sessiz): sıfır hiçbir şey göstermez ve yer tutmaz, böylece uygulama sayısını olduğu gibi verir; 99'un üstü bir Badge sayısı gibi 99+ okunur. Sayı sekmenin genişliğine dahildir, bu yüzden dar bir sekme önce adını kısaltır ve sayıyı korur; raydaki rozet gibi ad kayarken yerinde durur ve gizlenen bir sekme sayısını taşma menüsüne de götürür."

