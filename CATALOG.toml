[[item]]
id       = "motion"
name     = "Motion"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "motion"
types    = ["Easing", "Tween", "steps"]
notes    = "The base for everything that moves: timelines, easing, per-cell colour blending in proportion to the step, layer entrances and exits, theme durations and reduced motion. Frames are drawn only while something animates. When QUVYTA_REDUCED_MOTION is set it wins over the saved setting and runtime commands (1 reduces motion, 0 keeps it), and the reduced-motion switches are disabled and show the value in force."
notes-tr = "Hareket eden her şeyin temeli: zaman çizelgeleri, yumuşatma, adımla orantılı hücre başına renk karışımı, katman giriş çıkışları, temadan gelen süreler ve hareketi azaltma. Kareler yalnızca bir şey hareket ederken çizilir. QUVYTA_REDUCED_MOTION tanımlıysa kayıtlı ayardan ve çalışırken gelen komutlardan önce gelir (1 hareketi azaltır, 0 korur); bu durumda hareketi azaltma anahtarları pasif olur ve geçerli değeri gösterir."

[[item]]
id       = "text"
name     = "Text"
group    = "display"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "text"
types    = ["Text", "Span", "ELLIPSIS", "width", "grapheme_width", "truncate", "wrap", "wrap_ranges"]
notes    = "Text is not selectable by default; .selectable(true) turns it on. When wrapping, punctuation stays with its word."
notes-tr = "Metin varsayılan olarak seçilemez; .selectable(true) ile açılır. Satır sarılırken noktalama kelimesiyle birlikte kalır."

[[item]]
id       = "panel"
name     = "Panel"
group    = "structure"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "panel"
types    = ["Panel"]
notes    = "A pressable panel answers the pointer like a button: hover lifts the surface 8% towards the text colour with a soft pillar down the whole left edge, and a press flashes 16%. Keyboard focus looks like hover with a breathing pillar, and a selected panel keeps the full-height pillar like dialogs. .disabled(true) removes hover, focus and press."
notes-tr = "Basılabilir panel fareye buton gibi cevap verir: hover yüzeyi metin rengine doğru %8 açar ve sol kenar boyunca yumuşak bir çubuk gösterir, basış %16 parlar. Klavye odağı hover gibi görünür ve çubuk nefes alır; seçili panel diyaloglar gibi tam boy çubuğu korur. .disabled(true) hover, odak ve basışı kaldırır."

[[item]]
id       = "button"
name     = "Button"
group    = "controls"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "button"
types    = ["Button"]
notes    = "The pillar is always the leftmost cell: ▌ ⏎ Save, never ⏎ ▌ Save. The shortcut segment starts with the pillar cell, so nothing moves on hover."
notes-tr = "Vurgu çubuğu her zaman en soldaki hücredir: ▌ ⏎ Kaydet, asla ⏎ ▌ Kaydet. Kısayol parçası çubuk hücresiyle başlar, bu yüzden hover'da hiçbir şey kaymaz."

[[item]]
id       = "text-input"
name     = "Text input"
group    = "controls"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "text-input"
types    = ["TextInput"]
notes    = "Right click opens Cut, Copy, Paste and Select all. With a selection, the arrows move on from its ends. Paste reads the system clipboard first, and password fields never copy."
notes-tr = "Sağ tık Kes, Kopyala, Yapıştır ve Tümünü seç menüsünü açar. Seçim varken oklar seçimin uçlarından devam eder. Yapıştırma önce sistem panosunu okur; parola alanları hiçbir zaman kopyalamaz."

[[item]]
id       = "select"
name     = "Select"
group    = "controls"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "select"
types    = ["Select"]
notes    = "A click elsewhere closes the list and still reaches its target; a click on the select's own field only closes it. There is one highlight, and the pointer moves it only when the pointer itself moves. The scrollbar can be dragged."
notes-tr = "Başka bir yere tıklamak listeyi kapatır ve tıklama hedefine yine ulaşır; bileşenin kendi alanına tıklamak yalnızca kapatır. Tek bir vurgu vardır ve fare onu yalnızca kendisi hareket ettiğinde taşır. Kaydırma çubuğu sürüklenebilir."

[[item]]
id       = "list"
name     = "List"
group    = "structure"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "list"
types    = ["List", "ListItem", "ItemKind"]
notes    = "In multi-select, the check mark stays put and only the icon and label slide. A click on the mark only toggles the check."
notes-tr = "Çoklu seçimde işaret yerinde kalır, yalnızca ikon ve yazı kayar. İşarete tıklamak yalnızca işareti değiştirir."

