# Nordic: ice-blue accent on deep navy. Info moves to lavender because blue is the accent.

[meta]
name = "Nordic"
extends = "monochrome"

[colors]
canvas   = "#0B1118"
surface  = "#111A26"
raised   = "#192637"
active   = "#23344B"
overlay  = "#142030"
accent   = "#38BDF8"
accent-2 = "#A5E4FD"
text     = "#F0F9FF"
dim      = "#93C5E0"
muted    = "#4F7A96"
ink      = "#0B1118"
success  = "#7DDC9B"
warning  = "#F4C06A"
danger   = "#F2777A"
info     = "#B4A7F5"
# Series tones: the accent leads, then teal, sand, rose and lavender, spread around the wheel so
# neighbouring shares of a stacked bar never merge.
series-1 = "#38BDF8"
series-2 = "#5FD3AE"
series-3 = "#E3B778"
series-4 = "#EE8FA8"
series-5 = "#A99CF0"
