types    = ["DatePicker", "Date", "Weekday", "is_leap_year", "days_in_month"]
notes    = "One highlighted day, moved by keys and pointer alike, with three-cell month arrows; a click elsewhere closes the calendar and still reaches its target. The field, month arrows and highlighted day show the pillar in their blank leftmost cell, so nothing slides; the pillar breathes only under keyboard focus."
notes-tr = "Klavyenin de farenin de taşıdığı tek bir vurgulu gün ve üç hücrelik ay okları vardır; başka yere tıklamak takvimi kapatır ve tıklama hedefine yine ulaşır. Alan, ay okları ve vurgulu gün çubuğu en soldaki boş hücrelerinde gösterir, bu yüzden hiçbir şey kaymaz; çubuk yalnızca klavye odağında nefes alır."

[[item]]
id       = "time-input"
name     = "Time input"
group    = "forms"
kind     = "widget"
priority = "p3"
status   = "done"
page     = "time-input"
types    = ["TimeInput", "TimeOfDay"]
notes    = "The mouse wheel changes the segment under the pointer without a click; over a colon it changes the segment last hovered, or else the active one. ctrl a selects the whole time to copy or cut, pasting a time such as 9:30 sets it, and right click opens the edit menu."
notes-tr = "Fare tekerleği tıklamaya gerek kalmadan imlecin altındaki bölümü değiştirir; iki noktanın üzerindeyse en son üzerinden geçilen bölümü, yoksa etkin bölümü. ctrl a saatin tamamını kopyalamak ya da kesmek için seçer, 9:30 gibi bir saat yapıştırmak onu ayarlar, sağ tık düzenleme menüsünü açar."

