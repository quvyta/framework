notes    = "The mouse wheel over a slider moves it one step and is not passed on, so the page does not scroll. A disabled slider lets the wheel through."
notes-tr = "Sürgünün üzerinde fare tekerleği değeri bir adım değiştirir ve tekerleği sayfaya geçirmez, böylece sayfa kaymaz. Pasif sürgü tekerleği geçirir."

