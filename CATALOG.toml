[[item]]
id       = "modal"
name     = "Modal and dialog"
group    = "overlays"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "modal"
types    = ["Modal"]
notes    = "dismissable(bool) turns Esc and the three-cell close mark on or off together, never one without the other. A pillar runs down the whole left edge, in the danger colour for destructive dialogs. The close mark sits in the top right corner, on the surface's first row."
notes-tr = "dismissable(bool) Esc'i ve üç hücrelik kapatma işaretini birlikte açar ya da kapatır; biri ötekisiz olmaz. Sol kenar boyunca tam boy bir çubuk uzanır, yıkıcı pencerelerde tehlike renginde. Kapatma işareti yüzeyin ilk satırında, sağ üst köşededir."

[[item]]
id       = "confirm"
name     = "Confirmation"
group    = "overlays"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "confirm"
types    = ["Confirm"]
notes    = "Esc and the close mark cancel together; dismissable(false) leaves only the buttons. It has the same full-height pillar as every dialog."
notes-tr = "Esc ve kapatma işareti birlikte vazgeçer; dismissable(false) yalnızca butonları bırakır. Her pencerede olduğu gibi tam boy sol çubuğu vardır."

[[item]]
id       = "popover"
name     = "Popover"
group    = "overlays"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "popover"
types    = ["Popover", "Placement"]
notes    = "The press that dismisses a popover still reaches what it landed on, except that a press on the widget that opened it only closes it. Dialogs, by contrast, swallow presses outside them."
notes-tr = "Açılır kutuyu kapatan tıklama düştüğü yere de ulaşır; yalnızca kutuyu açan bileşene tıklamak onu sadece kapatır. Pencereler ise dışlarındaki tıklamaları yutar."

[[item]]
id       = "context-menu"
name     = "Context menu"
group    = "overlays"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "context-menu"
types    = ["ContextMenu", "ContextItem"]
notes    = "Opens with right click or the menu key. Text fields and selections build their edit menus on it."
notes-tr = "Sağ tıkla ya da menü tuşuyla açılır. Metin alanları ve seçimler düzenleme menülerini bunun üzerine kurar."

[[item]]
id       = "toast"
name     = "Toast"
group    = "overlays"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "toast"
types    = ["Toast", "ToastKind", "Corner"]
notes    = "Any one-cell spinner animation can play in the icon cell with icon_motion. Only the three-cell close mark shared with tabs dismisses a toast, and only the pointer on it lights it. A press on the body does nothing unless on_press gives it a message; then the toast stays and rises one step under the pointer."
notes-tr = "icon_motion ile tek hücrelik herhangi bir spinner animasyonu ikon hücresinde oynar. Bildirimi yalnızca sekmelerle ortak üç hücrelik kapatma işareti kapatır ve işaret yalnızca imleç üzerindeyken aydınlanır. Gövdeye basmak, on_press bir mesaj vermedikçe hiçbir şey yapmaz; verirse bildirim yerinde kalır ve imlecin altında bir kademe yükselir."

[[item]]
id       = "tooltip"
name     = "Tooltip"
group    = "overlays"
