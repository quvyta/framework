notes    = "Markdown is selectable by default; clean copies leave out pillars, code padding and line numbers. Punctuation after inline code never wraps onto a line alone, even when a code span wider than the line breaks, and three-digit list numbers show in full."
notes-tr = "Markdown varsayılan olarak seçilebilir; temiz kopya çubukları, kod iç boşluğunu ve satır numaralarını dışarıda bırakır. Satır içi koddan sonraki noktalama, satırdan geniş bir kod parçası bölünse bile tek başına alt satıra düşmez; üç haneli liste numaraları tam görünür."

[[item]]
id       = "code-view"
name     = "Code view"
group    = "content"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "code-view"
types    = ["CodeView", "Language", "LineMark", "LineTone"]
notes    = "The code is selectable by default, but its padding never is. Clean copies leave line numbers out, and the signs of marked lines. For reviewing a recipe or a diff: Language::Shell colours bash (a PKGBUILD, an .install file; Language::from_file_name picks it), line_marks tints added and removed lines with a + or − sign, highlight_lines tints lines in the accent (with the pillar) or a warning (with its icon), and reveal(line) asks the enclosing scroll view, through PaintCx::reveal, to glide just far enough to show the line with two rows of context, once each time the line changes. In a diff the line numbers follow the files rather than the text, because a diff stands two versions' lines one after another and counting from the top numbers neither: a removed line carries the old file's number, an added line the new file's, a line in both the new file's. CodeView::reveal_number(n) goes to the line that number means, preferring the line the new file numbers that way over one the old file lost, which is what a finding such as PKGBUILD:22 asks for; CodeView::line_numbers_from(numbers) gives each line its number outright, for a hunk that starts part way into a file, with None for a line that has none."
notes-tr = "Kod varsayılan olarak seçilebilir, iç boşluğu ise hiçbir zaman seçilmez. Temiz kopya satır numaralarını ve işaretli satırların işaretlerini almaz. Tarif ya da fark incelemek için: Language::Shell bash renklendirir (PKGBUILD, .install; Language::from_file_name seçer), line_marks eklenen ve silinen satırları + ya da − işaretiyle tonlar, highlight_lines satırları vurgu tonunda (dikey çubukla) ya da uyarı tonunda (ikonuyla) boyar, reveal(satır) çevreleyen kaydırma alanından PaintCx::reveal ile satırı iki satır bağlamla gösterecek kadar kaymasını ister; satır her değiştiğinde bir kez. Farkta satır numaraları metni değil dosyaları izler, çünkü fark iki sürümün satırlarını arka arkaya dizer ve baştan saymak ikisinden hiçbirini numaralamaz: silinen satır eski dosyanın numarasını, eklenen satır yeni dosyanınkini, ikisinde de olan satır yeni dosyanınkini taşır. CodeView::reveal_number(n) o numaranın anlattığı satıra gider ve yeni dosyanın o numarayı verdiği satırı eski dosyanın kaybettiği satıra tercih eder; PKGBUILD:22 gibi bir bulgunun istediği budur. CodeView::line_numbers_from(numaralar) her satıra numarasını doğrudan verir, dosyanın ortasından başlayan bir parça için, numarası olmayan satıra None ile."

