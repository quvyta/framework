priority = "p1"
status   = "done"
page     = "motion"
types    = ["Easing", "Tween", "steps"]
notes    = "The base for everything that moves: timelines, easing, per-cell colour blending in proportion to the step, layer entrances and exits, theme durations and reduced motion. Frames are drawn only while something animates. When QUVYTA_REDUCED_MOTION is set it wins over the saved setting and runtime commands (1 reduces motion, 0 keeps it), and the reduced-motion switches are disabled and show the value in force."
notes-tr = "Hareket eden her şeyin temeli: zaman çizelgeleri, yumuşatma, adımla orantılı hücre başına renk karışımı, katman giriş çıkışları, temadan gelen süreler ve hareketi azaltma. Kareler yalnızca bir şey hareket ederken çizilir. QUVYTA_REDUCED_MOTION tanımlıysa kayıtlı ayardan ve çalışırken gelen komutlardan önce gelir (1 hareketi azaltır, 0 korur); bu durumda hareketi azaltma anahtarları pasif olur ve geçerli değeri gösterir."

[[item]]
id       = "text"
name     = "Text"
group    = "display"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "text"
types    = ["Text", "Span", "ELLIPSIS", "width", "grapheme_width", "truncate", "truncate_middle", "wrap", "wrap_ranges"]
notes    = "Text is not selectable by default; .selectable(true) turns it on. When wrapping, punctuation stays with its word. Chinese and Japanese break between characters, but closing marks (。、，！）」, the long vowel ー, small kana, fullwidth forms) never start a line and opening brackets (「（) never end one; Korean keeps its words whole. No-break spaces (U+00A0, U+202F, U+2007) belong to the word, so French ? and : never start a line. Only a run of closing marks wider than the line breaks the rule. truncate_middle cuts a path in the middle, so ~/.config/quvyta/launcher.conf keeps its folder tree and its file name: the cells after the ellipsis are shared between start and end, the end getting the odd one, and a wide character or a letter with its accent is never split."
notes-tr = "Metin varsayılan olarak seçilemez; .selectable(true) ile açılır. Satır sarılırken noktalama kelimesiyle birlikte kalır. Çince ve Japonca karakterler arasında kırılır, ama kapanış işaretleri (。、，！）」, uzatma işareti ー, küçük kana, tam genişlik biçimleri) satır başına, açılış parantezleri (「（) satır sonuna düşmez; Korece kelimeler bütün kalır. Bölünmez boşluklar (U+00A0, U+202F, U+2007) kelimenin parçasıdır, bu yüzden Fransızca ? ve : satır başına düşmez. Kuralı yalnızca satırdan geniş bir kapanış işaretleri dizisi bozar. truncate_middle bir yolu ortasından kısaltır; ~/.config/quvyta/launcher.conf klasör ağacını da dosya adını da korur: üç noktadan sonra kalan hücreler baş ile son arasında paylaşılır, tek kalan hücre sona gider, geniş bir karakter ya da aksanıyla bir harf asla bölünmez."

[[item]]
id       = "panel"
name     = "Panel"
group    = "structure"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "panel"
types    = ["Panel"]
notes    = "A pressable panel answers the pointer like a button: hover lifts the surface 8% towards the text colour with a soft pillar down the whole left edge, and a press flashes 16%. Keyboard focus looks like hover with a breathing pillar, and a selected panel keeps the full-height pillar like dialogs. .disabled(true) removes hover, focus and press."
notes-tr = "Basılabilir panel fareye buton gibi cevap verir: hover yüzeyi metin rengine doğru %8 açar ve sol kenar boyunca yumuşak bir çubuk gösterir, basış %16 parlar. Klavye odağı hover gibi görünür ve çubuk nefes alır; seçili panel diyaloglar gibi tam boy çubuğu korur. .disabled(true) hover, odak ve basışı kaldırır."

[[item]]
id       = "button"
name     = "Button"
group    = "controls"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "button"
types    = ["Button"]
notes    = "The pillar is always the leftmost cell: ▌ ⏎ Save, never ⏎ ▌ Save. The shortcut segment starts with the pillar cell, so nothing moves on hover."
notes-tr = "Vurgu çubuğu her zaman en soldaki hücredir: ▌ ⏎ Kaydet, asla ⏎ ▌ Kaydet. Kısayol parçası çubuk hücresiyle başlar, bu yüzden hover'da hiçbir şey kaymaz."

[[item]]
id       = "icon-button"
name     = "Icon button"
group    = "controls"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "icon-button"
types    = ["IconButton"]
notes    = "A new component, not a Button option: a button is a raised surface with theme padding and a pillar cell before its content, and an icon button has none of them, so making one from the other would take three options that each switch off something every button has. It is a space, one glyph and a space, three cells in every glyph mode, on the ground around it with no surface at rest. The tone ladder rest < hover < focus < pressed lights all three cells; focus is a tone of its own, because three cells leave no room for a pillar before the glyph. tooltip(text) names it after the hover delay and at once from the keyboard, drawn by the same code as Tooltip, because a lone glyph needs words more than any labelled control. The settings icon stays ▤ in Unicode: ⚙ says it better, but many monospace fonts lack it and it has an emoji form some terminals draw two cells wide, so it would overflow the cell; the Nerd Font column carries the cog."
notes-tr = "Button'un bir seçeneği değil, yeni bir bileşen: buton, temadan gelen iç boşluğu ve içeriğinden önce bir çubuk hücresi olan yükselmiş bir yüzeydir; ikon butonunda bunların hiçbiri yoktur, biri ötekinden ancak her butonda olan bir şeyi kapatan üç ayrı seçenekle yapılabilirdi. Bir boşluk, tek glif ve bir boşluktur; her glif kipinde üç hücre, dururken yüzeysiz, çevresindeki zeminin üstünde. Ton merdiveni dinlenme < hover < odak < basılı üç hücreyi birlikte aydınlatır; odak kendi tonudur, çünkü üç hücrede glifin önüne çubuk sığmaz. tooltip(metin) onu hover gecikmesinden sonra, klavyeyle gelince de hemen adlandırır ve Tooltip'le aynı kodla çizilir; tek başına bir glif, etiketli her kontrolden çok söze ihtiyaç duyar. Ayarlar ikonu Unicode'da ▤ olarak kaldı: ⚙ anlamı daha iyi anlatır ama birçok eşit aralıklı yazı tipinde yoktur ve bazı terminallerin iki hücre çizdiği bir emoji biçimi vardır, hücreden taşar; dişliyi Nerd Font sütunu taşır."

[[item]]
id       = "text-input"
name     = "Text input"
group    = "controls"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "text-input"
types    = ["TextInput"]
notes    = "Right click opens Cut, Copy, Paste and Select all. With a selection, the arrows move on from its ends. Paste reads the system clipboard first, and password fields never copy. select_on_focus(range) opens the field with part of its text selected (characters, not bytes), for a rename that keeps the extension; select_all_on_focus selects everything. It applies as the field gains focus, never after an outside change, and a click that brings focus places the cursor instead."
notes-tr = "Sağ tık Kes, Kopyala, Yapıştır ve Tümünü seç menüsünü açar. Seçim varken oklar seçimin uçlarından devam eder. Yapıştırma önce sistem panosunu okur; parola alanları hiçbir zaman kopyalamaz. select_on_focus(aralık) alanı metnin bir kısmı seçili açar (bayt değil karakter sayılır), uzantıyı koruyan yeniden adlandırma için; select_all_on_focus hepsini seçer. Alan odak aldığında uygulanır, dışarıdan değişiklikten sonra yeniden uygulanmaz; odağı getiren tıklama imleci yerleştirir."

[[item]]
