notes-tr = "Fareyle de tam kullanılır: imleç hareket edince tek vurguyu taşır, tıklama komutu çalıştırır, tekerlek ve kaydırma çubuğu kaydırır. Kapatma işareti ve Esc birlikte gelir; her pencerede olduğu gibi tam boy sol çubuk vardır."

