[package]
name = "quvyta-framework-showcase"
description = "Every component of the Quvyta terminal UI framework, live: demos, code, guides and references"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/quvyta/framework"
homepage.workspace = true
# The showcase is a program with no API of its own; the library it demonstrates is documented here.
documentation = "https://docs.rs/quvyta-framework"
readme = "README.md"
keywords = ["tui", "terminal", "showcase", "widgets", "demo"]
categories = ["command-line-interface", "command-line-utilities"]
# `cargo run` starts the short command; `src/main.rs` is the long one.
default-run = "qframe"

[lints]
workspace = true

[dependencies]
quvyta-framework = { version = "0.1.17", path = "../quvyta-framework", features = ["pty", "updates"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "preserve_order"] }

[dev-dependencies]
# Draws the README screenshots (an ignored test); by path only, so publishing leaves it out.
quvyta-framework-shots = { path = "../shots" }
