name     = "Scrollbar styles"
group    = "structure"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "scrollbar-styles"
types    = ["ScrollbarStyle"]
notes    = "The theme chooses the scrollbar style, and a scrollbar shows only when content overflows, never as a frame. Block is the default and is drawn with colours only; the others are half, thin and dots. Any other word in a theme, such as cell, is reported as a diagnostic."
notes-tr = "Kaydırma çubuğu stilini tema seçer; çubuk yalnızca içerik taştığında görünür ve çerçeve çizmez. Varsayılan block yalnızca renkle çizilir; diğerleri half, thin ve dots'tur. Temada bunların dışındaki bir sözcük, örneğin cell, tanılama olarak bildirilir."

[[item]]
id       = "tab-rail"
name     = "Tab rail"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "tab-rail"
types    = ["TabRail", "RailTab", "CollapsedMarker"]
notes    = "Vertical tabs with icon and name, status badges and a raised selected tab; closing, reordering, the context menu and edge scrolling while dragging are shared with Tabs. Collapsed, the rail is a four-cell strip (pillar, marker, a cell of air, scrollbar) that never slides; collapsed_marker and RailTab::marker show an icon, an initial or a number, and a tab's name card opens it on a click. row_height(n) makes each tab a raised block n lines tall, with content on the middle line and the close mark flush right on the first; blocks are one empty line apart unless gap(n) says otherwise. An optional add tab sits at the end."
notes-tr = "İkon ve isimli, durum rozetli, seçili sekmesi yükselen dikey sekmeler; kapatma, sıralama, sağ tık menüsü ve sürüklerken kenar kaydırma Tabs ile ortaktır. Daraltılınca ray hiç kaymayan dört hücrelik bir şerit olur (çubuk, işaret, bir hücre boşluk, kaydırma çubuğu); collapsed_marker ve RailTab::marker ikon, baş harf ya da numara gösterir, sekmenin ad kartı tıklanınca sekmeyi açar. row_height(n) her sekmeyi n satırlık yükseltilmiş bir blok yapar; içerik orta satırda, kapatma işareti ilk satırda sağa yaslıdır ve gap(n) başka bir şey söylemedikçe bloklar arasında bir boş satır kalır. Sonda isteğe bağlı bir ekle sekmesi bulunur."

[[item]]
id       = "widget-dock"
name     = "Widget dock"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "widget-dock"
types    = ["WidgetDock"]
notes    = "A stack of titled sections, like the right panel of an editor: each expands and collapses, and sections are dragged to reorder. Order and collapsed state live in application state so they can be saved. The chevron stays put; only the icon and title slide."
notes-tr = "Bir editörün sağ paneli gibi başlıklı bölümlerden oluşan bir yığın: her bölüm açılıp kapanır ve sürüklenerek yeniden sıralanır. Sıra ve kapalı durumu uygulama durumunda tutulur, böylece kaydedilebilir. Ok yerinde kalır; yalnızca ikon ve başlık kayar."

[[item]]
id       = "side-panel"
name     = "Side panel"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "side-panel"
types    = ["SidePanel", "Side", "Closed"]
notes    = "A resizable side panel whose edge is a tone change that brightens on hover, never a drawn line; the two-cell toggle on the edge shows its pillar only under the pointer or visible keyboard focus. The optional icon strip is an activity bar that stays beside the open panel: active_view raises the shown view's icon, another icon switches views, the shown icon closes the panel and any icon opens a closed one. closed(Closed::Hide) removes the strip too and leaves one edge column in the body's tone, and dragging a closed edge opens the panel. Size limits are the application's choice, and a max of None means no limit."
notes-tr = "Kenarı çizgi değil, hover'da aydınlanan bir ton farkı olan, boyutlanabilen yan panel; kenardaki iki hücrelik düğmenin çubuğu yalnızca imleç üzerindeyken ya da klavye odağı görünürken çizilir. İsteğe bağlı ikon şeridi, açık panelin yanında da duran bir etkinlik çubuğudur: active_view gösterilen görünümün ikonunu yükseltir, başka bir ikon görünümü değiştirir, gösterilen ikon paneli kapatır, panel kapalıyken her ikon onu açar. closed(Closed::Hide) şeridi de kaldırır ve gövde tonunda tek bir kenar sütunu bırakır; kapalı kenarı sürüklemek paneli açar. Boyut sınırlarını uygulama seçer; max için None sınırsız demektir."
