[[item]]
id       = "command-palette"
name     = "Command palette"
group    = "overlays"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "command-palette"
types    = ["CommandPalette", "PaletteCommand"]
notes    = "Fully usable with the mouse: once the pointer moves it carries the single highlight, a click runs the command, and the wheel and scrollbar scroll. The close mark and Esc come together, with the full-height pillar of every dialog."
notes-tr = "Fareyle de tam kullanılır: imleç hareket edince tek vurguyu taşır, tıklama komutu çalıştırır, tekerlek ve kaydırma çubuğu kaydırır. Kapatma işareti ve Esc birlikte gelir; her pencerede olduğu gibi tam boy sol çubuk vardır."

[[item]]
id       = "hold-to-confirm"
name     = "Hold to confirm"
group    = "overlays"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "hold-to-confirm"
types    = ["HoldToConfirm"]
notes    = "A hold-to-confirm indicator for destructive actions. Each bar blends as a whole from the track colour to the theme's warning tone, one after another over the chosen duration, and the action fires when the third bar is full; letting go empties them quickly. .color(expression) picks the bar colour with a theme expression such as $danger or a fixed #RRGGBB, and an invalid expression falls back to the theme's hold.to."
notes-tr = "Yıkıcı eylemler için basılı tutarak onaylama göstergesi. Her bar bir bütün olarak iz renginden temanın uyarı rengine, seçilen süre içinde birbiri ardına geçer; üçüncü bar dolunca eylem gerçekleşir, bırakınca barlar hızla boşalır. .color(ifade) bar rengini $danger gibi bir tema ifadesiyle ya da sabit bir #RRGGBB ile seçer; geçersiz ifade temanın hold.to rengine döner."

[[item]]
id       = "tabs-advanced"
name     = "Tabs: close, sizes, overflow, reorder"
group    = "structure"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "tabs-advanced"
types    = ["TabWidth", "Overflow", "TabEdit"]
notes    = "Tabs grows through independent options while plain Tabs stays plain: closable, tab_width (Fit, Fixed or Fill), overflow (arrows or a menu of hidden tabs), reorderable and context_menu, all shared with TabRail through one tab model. A click on a tab closes an open overflow menu and opens the tab. A dragged tab held on a scroll arrow or past an end of the strip scrolls it, first after 400 ms and then every 150 ms, faster the further past the edge it is; on_drag_scroll reports each step."
notes-tr = "Tabs bağımsız seçeneklerle büyür, sade Tabs sade kalır: closable, tab_width (Fit, Fixed ya da Fill), overflow (oklar ya da gizli sekmeler menüsü), reorderable ve context_menu; hepsi tek bir sekme modeli üzerinden TabRail ile ortaktır. Taşma menüsü açıkken bir sekmeye tıklamak menüyü kapatır ve sekmeyi açar. Kaydırma okunun üzerinde ya da şeridin ucunun ötesinde tutulan sürüklenen sekme şeridi kaydırır: önce 400 ms sonra, ardından her 150 ms'de bir ve kenardan uzaklaştıkça daha hızlı; on_drag_scroll her adımı bildirir."

