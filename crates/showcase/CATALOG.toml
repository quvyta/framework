[[item]]
id       = "handoff"
name     = "Handoff"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "handoff"
types    = ["Handoff", "HandoffOutcome", "HandoffRequest"]
notes    = "A handoff blocks drawing on purpose: the user is talking to another program. The program runs in a process group of its own that is made the terminal's foreground while it runs, so Ctrl-C at a sudo prompt reaches the program and never ends the application, whose signal dispositions are never touched; taking the terminal back blocks SIGTTOU on the drawing thread for one call, through nix, the only safe way to block a signal. A process group is not a session: the program keeps the controlling terminal and the session, so a warm sudo ticket is still shared. Ctrl-Z does not suspend; a stopped program is continued. The screen is taken back and drawn again in full however the program ended."
notes-tr = "Teslim çizimi bilerek durdurur: kullanıcı başka bir programla konuşuyordur. Program kendi süreç grubunda çalışır ve bu grup çalıştığı sürece terminalin ön planı yapılır; sudo isteminde Ctrl-C programa ulaşır, uygulamayı asla kapatmaz ve uygulamanın sinyal ayarlarına hiç dokunulmaz. Terminal geri alınırken çizim iş parçacığında tek bir çağrı için SIGTTOU engellenir; sinyal engellemenin tek güvenli yolu olan nix ile. Süreç grubu oturum değildir: program kontrol eden terminali ve oturumu korur, sıcak bir sudo bileti paylaşılmaya devam eder. Ctrl-Z askıya almaz; duran program devam ettirilir. Program nasıl biterse bitsin ekran geri alınır ve baştan çizilir."

[[item]]
id       = "subprocess"
name     = "Child process"
group    = "foundations"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "async-tasks"
types    = ["Process", "Line", "ProcessOutcome"]
notes    = "Runs a child inside a task and hands its output to the application line by line. With pipes standard output and standard error stay apart, so a failure stays recognisable; with pty(cols, rows) the child gets a pseudo-terminal of the size we choose, so programs that check for a terminal keep their progress and colour, and every line then arrives as Out. A carriage return overwrites the line being built instead of starting a new one, the last line is delivered without a trailing newline, and bytes that are not UTF-8 become the replacement character. Standard input stays the application's own and the child is not put in its own session, which is what keeps a warm sudo ticket shared. no_stdin() gives the child an empty input instead, so a question it asks cannot take the application's keys, and on Unix starts it in a process group of its own, so cancelling kills the whole group and the programs it started go too. Only then: a child that reads the terminal from a group of its own would be stopped by the system, so with inherited input only the child itself is killed."
notes-tr = "Bir alt süreci bir iş içinde çalıştırır ve çıktısını uygulamaya satır satır verir. Boruyla standart çıktı ve standart hata ayrı kalır, böylece hata hata olarak tanınır; pty(sütun, satır) ile çocuk bizim verdiğimiz boyutta bir sözde terminal alır, terminal denetimi yapan programlar ilerlemesini ve rengini korur ve her satır Out olarak gelir. Satır başı, yeni satır açmak yerine yazılmakta olan satırı ezer; son satır sonunda yeni satır olmasa da teslim edilir; UTF-8 olmayan baytlar değiştirme karakterine döner. Standart girdi uygulamanın kendi girdisi kalır ve çocuk kendi oturumuna konmaz; sıcak sudo biletinin paylaşılmasını sağlayan budur. no_stdin() çocuğa bunun yerine boş bir girdi verir; sorduğu bir soru uygulamanın tuşlarını alamaz. Unix'te onu kendi süreç grubunda da başlatır; iptal bütün grubu öldürür, başlattığı programlar da gider. Yalnızca o zaman: terminali kendi grubundan okuyan bir çocuğu sistem durdurur, bu yüzden devralınan girdiyle yalnızca çocuğun kendisi öldürülür."

[[item]]
id       = "document"
name     = "Data file"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "document"
types    = ["Document", "Shape", "ValueKind", "Table"]
notes    = "An application's own data file, where Settings stops: a declared shape, arrays of tables ([[profile]]) and nested tables, and no self-healing at all. A key nobody declared, a value of another type and a required key that is missing are each a located diagnostic; Table::location gives a key's place and Table::value_location its value's, the column the framework's own findings use, so an application's own checks land on the same column, and the readable part of a broken document is still given, because a file edited by hand is usually wrong in one place. Reading writes nothing: no repair, no default written into the file, no .bak, and the type has no way to write. Saving stays the application's own step with atomic_write, since only the application knows the order, grouping and comments its file should have."
notes-tr = "Settings'in bittiği yerde uygulamanın kendi veri dosyası: tanımlı bir şekil, tablo dizileri ([[profile]]) ve iç içe tablolar, kendini onarma ise hiç yok. Kimsenin tanımlamadığı bir anahtar, başka türden bir değer ve eksik bir zorunlu anahtar yeri belirtilen birer tanı olur; Table::location anahtarın, Table::value_location değerin yerini verir, framework'ün kendi bulgularının kullandığı sütunu, böylece uygulamanın kendi denetimleri de aynı sütuna düşer; bozuk bir belgenin okunabilen kısmı yine verilir, çünkü elle düzenlenen dosya genelde tek yerinden bozuktur. Okumak hiçbir şey yazmaz: onarım yok, dosyaya yazılan varsayılan yok, .bak yok ve tipin yazma yolu hiç yok. Kaydetmek atomic_write ile uygulamanın kendi adımı kalır, çünkü dosyanın sırasını, gruplamasını ve yorumlarını yalnızca uygulama bilir."

