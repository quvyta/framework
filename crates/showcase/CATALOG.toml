notes-tr = "Varsayılan, boş ile dolu arasında renk karışımıyla geçen iki hücrelik düz renkli kutudur; kısmen işaretli kutu sol hücresini doldurur. CheckboxStyle::Check bunun yerine tikli, üç hücrelik bir kutu çizer."

