notes    = "A stack of titled sections, like the right panel of an editor: each expands and collapses, and sections are dragged to reorder. Order and collapsed state live in application state so they can be saved. The chevron stays put; only the icon and title slide."
notes-tr = "Bir editörün sağ paneli gibi başlıklı bölümlerden oluşan bir yığın: her bölüm açılıp kapanır ve sürüklenerek yeniden sıralanır. Sıra ve kapalı durumu uygulama durumunda tutulur, böylece kaydedilebilir. Ok yerinde kalır; yalnızca ikon ve başlık kayar."

[[item]]
id       = "side-panel"
name     = "Side panel"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "side-panel"
types    = ["SidePanel", "Side", "Closed"]
notes    = "A resizable side panel whose edge is a tone change that brightens on hover, never a drawn line; the two-cell toggle on the edge shows its pillar only under the pointer or visible keyboard focus. The optional icon strip is an activity bar that stays beside the open panel: active_view raises the shown view's icon, another icon switches views, the shown icon closes the panel and any icon opens a closed one. closed(Closed::Hide) removes the strip too and leaves one edge column in the body's tone, and dragging a closed edge opens the panel. Size limits are the application's choice, and a max of None means no limit."
notes-tr = "Kenarı çizgi değil, hover'da aydınlanan bir ton farkı olan, boyutlanabilen yan panel; kenardaki iki hücrelik düğmenin çubuğu yalnızca imleç üzerindeyken ya da klavye odağı görünürken çizilir. İsteğe bağlı ikon şeridi, açık panelin yanında da duran bir etkinlik çubuğudur: active_view gösterilen görünümün ikonunu yükseltir, başka bir ikon görünümü değiştirir, gösterilen ikon paneli kapatır, panel kapalıyken her ikon onu açar. closed(Closed::Hide) şeridi de kaldırır ve gövde tonunda tek bir kenar sütunu bırakır; kapalı kenarı sürüklemek paneli açar. Boyut sınırlarını uygulama seçer; max için None sınırsız demektir."
