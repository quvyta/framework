[[item]]
id       = "tree"
name     = "Tree"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "tree"
types    = ["Tree", "TreeNode", "TreeMove"]
notes    = "Indentation and chevron stay put; only the icon and label slide. A loading node keeps its chevron for the first 300 ms and then spins for at least 500 ms, so quick loads never flash a spinner. Reorderable, a node is dragged among its siblings like a tab of the tab rail: the siblings make room, a ghost follows the pointer, the dragged node's children fold away and a drag held on the top or bottom row scrolls. ctrl shift up and down do the same from the keyboard, and the move is one TreeMove the application applies to its own list. A node keeps its parent: moving it elsewhere is an application action, offered in the context menu that a right click, shift f10 or the menu key opens."
notes-tr = "Girinti ve ok yerinde kalır; yalnızca ikon ve yazı kayar. Yüklenen düğüm ilk 300 ms okunu korur, sonra en az 500 ms döner; böylece hızlı yüklemelerde spinner bir anlığına belirip kaybolmaz. Sıralanabilir ağaçta bir düğüm, tab rail'deki sekme gibi kardeşleri arasında sürüklenir: kardeşler yer açar, bir hayalet imleci izler, sürüklenen düğümün çocukları katlanır ve üst ya da alt satırda tutulan sürükleme ağacı kaydırır. Klavyede ctrl shift yukarı ve aşağı aynısını yapar; taşıma, uygulamanın kendi listesine uyguladığı tek bir TreeMove'dur. Düğüm ebeveynini korur: başka yere taşımak uygulamanın eylemidir ve sağ tık, shift f10 ya da menü tuşunun açtığı bağlam menüsünde sunulur."

