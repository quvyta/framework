icons-ascii        = "ASCII"
everywhere         = "In every {family} application"
reduce-motion      = "Reduce motion"
reduce-motion-text = "Layers appear at once; nothing breathes or spins."
forced-on          = "Reduced by the shell (QUVYTA_REDUCED_MOTION); the setting cannot change it here."
forced-off         = "Kept by the shell (QUVYTA_REDUCED_MOTION); the setting cannot change it here."
