notes    = "The boundary is never a drawn line: it is a tone change that brightens one step on hover and turns to the accent while dragging. It resizes with the pointer or the keyboard, and limits(min, max) takes a number, or None for no maximum."
notes-tr = "Sınır hiçbir zaman çizgi olarak çizilmez: hover'da bir kademe aydınlanan, sürüklerken vurgu rengine dönen bir ton farkıdır. Fareyle ya da klavyeyle boyutlanır; limits(min, max) max için bir sayı ya da üst sınır olmaması için None alır."

[[item]]
id       = "windows"
name     = "Windows"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "windows"
types    = ["Window", "WindowEvent", "WindowEdge", "Ghost"]
notes    = "A window is a surface with a one-row title strip and no lines: icon, name, faint subtitle, and three marks that follow the shared close mark's rule. The focused window is one tone raised with a bright name and the pillar down its left edge. It is placed with ui.place(rect, ..) inside a stack, where later children are on top and take the pointer first; a rectangle may reach past the screen and is cut off. The title drags, the body's right column, bottom row and corner resize like a splitter's boundary, and alt with the left or right button moves or resizes from anywhere, which is what a one-row title leaves no room for. Every movement arrives as a WindowEvent; where a window goes, which is in front, the smallest size and snapping stay in the application. In 16 colours all surface tones fall to black, so the strip takes the accent on the focused window and a grey on the others. A drag ends with WindowEvent::Dropped, which is where snapping to an edge and the landing of a ghost drag belong: Ghost paints a rectangle with the accent mixed into whatever lies under it, for the ghost a slow connection drags instead of the window and for the area it would snap to."
notes-tr = "Pencere, bir satırlık başlık şeridi olan ve hiç çizgi kullanmayan bir yüzeydir: ikon, ad, soluk alt başlık ve ortak kapatma işaretinin kuralına uyan üç işaret. Odaktaki pencere bir ton yükselir, adı parlar ve sol kenarında vurgu çubuğu durur. Bir stack içinde ui.place(rect, ..) ile yerleştirilir; sonra gelen çocuk üstte çizilir ve fareyi önce o alır, dikdörtgen ekran dışına taşarsa kırpılır. Başlık taşır; gövdenin sağ sütunu, alt satırı ve köşesi splitter sınırı gibi boyutlandırır; alt ile sol ya da sağ tuş her yerden taşır ya da boyutlandırır, çünkü tek satırlık başlık ikisine birlikte yetmez. Her hareket bir WindowEvent olarak gelir; pencerenin nereye gittiği, hangisinin önde olduğu, en küçük boyut ve kenara yapıştırma uygulamada kalır. 16 renkte bütün yüzey tonları siyaha düştüğü için şerit odaktaki pencerede vurgu rengini, ötekilerde griyi alır. Sürükleme WindowEvent::Dropped ile biter; kenara yapıştırma ve hayalet sürüklemenin yerine oturması oraya aittir. Ghost, verilen dikdörtgeni altında ne varsa ona vurgu rengini karıştırarak boyar: yavaş bağlantıda pencere yerine sürüklenen hayalet ve pencerenin yapışacağı alan için."

