[[item]]
id       = "modal"
name     = "Modal and dialog"
group    = "overlays"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "modal"
types    = ["Modal"]
notes    = "dismissable(bool) turns Esc and the three-cell close mark on or off together, never one without the other. A pillar runs down the whole left edge, in the danger colour for destructive dialogs. The close mark sits in the top right corner, on the surface's first row."
notes-tr = "dismissable(bool) Esc'i ve üç hücrelik kapatma işaretini birlikte açar ya da kapatır; biri ötekisiz olmaz. Sol kenar boyunca tam boy bir çubuk uzanır, yıkıcı pencerelerde tehlike renginde. Kapatma işareti yüzeyin ilk satırında, sağ üst köşededir."

[[item]]
id       = "confirm"
name     = "Confirmation"
group    = "overlays"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "confirm"
types    = ["Confirm"]
notes    = "Esc and the close mark cancel together; dismissable(false) leaves only the buttons. It has the same full-height pillar as every dialog. alternative(label, message) adds a third, plain button between Cancel and the confirm button for questions such as Discard, Continue, Save; Cancel keeps the focus and Tab visits the buttons left to right. Without it the two-button dialog is unchanged. require_word(word) asks for a word to be typed before an irreversible action: the field has focus first and the confirm button stays disabled until the text matches, ignoring surrounding spaces and case, with İ, I, ı and i the same letter; the alternative is not gated."
notes-tr = "Esc ve kapatma işareti birlikte vazgeçer; dismissable(false) yalnızca butonları bırakır. Her pencerede olduğu gibi tam boy sol çubuğu vardır. alternative(etiket, mesaj) At, Sürdür, Kaydet gibi sorular için Vazgeç ile onay butonu arasına üçüncü, düz bir buton ekler; odak Vazgeç'te kalır, Tab butonları soldan sağa gezer. Verilmezse iki butonlu pencere değişmez. require_word(sözcük) geri alınamayan bir işten önce bir sözcük yazdırır: odak önce alandadır, metin eşleşene kadar onay butonu pasiftir; baştaki ve sondaki boşluklar ile büyük-küçük harf yok sayılır, İ, I, ı ve i aynı harftir; üçüncü yol beklemez."

[[item]]
id       = "popover"
name     = "Popover"
group    = "overlays"
