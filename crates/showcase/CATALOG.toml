[[item]]
id       = "radio-group"
name     = "Radio group"
group    = "controls"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "radio-group"
types    = ["RadioGroup", "RadioStyle"]
notes    = "The default RadioStyle::Square draws a small square for every option and only blends its colour to the chosen tone over two motion steps, so the shape never changes. Mark swaps the small square for a full box halfway through the blend, Box looks like the checkbox and Dot draws a dot. The quiet square is mix($muted, $raised, 70%) and hover lifts it to $muted, so a hovered square never looks chosen. A blank icon, as in ASCII mode, falls back to box tones, and a theme can replace the icons."
notes-tr = "Varsayılan RadioStyle::Square her seçenekte küçük bir kare çizer ve yalnızca rengini iki motion adımı boyunca seçili tona karıştırır; şekil hiç değişmez. Mark karışımın yarısında küçük kareyi dolu kutuyla değiştirir, Box onay kutusuyla aynı görünür, Dot ise nokta çizer. Sakin kare mix($muted, $raised, 70%) tonundadır ve hover onu $muted tonuna açar; böylece üzerine gelinen kare seçili gibi görünmez. ASCII modundaki gibi boş bir simge kutu tonlarına döner ve tema simgeleri değiştirebilir."

