[[item]]
id       = "spinner"
name     = "Spinner"
group    = "display"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "spinner"
types    = ["Spinner", "SpinnerStyle"]
notes    = "Single-cell styles in alphabetical order with Arc as the default; each style is a built-in cell animation, and Spinner::animation(name) plays any other. Arc uses the Nerd Font progress spinner frames, Quarters uses quadrant blocks that always fit one cell, and Slices turns half circles in Unicode mode. Spinner::done(true) plays a growing tick once, blending to $success, and rests on it; with reduced motion the tick shows at once."
notes-tr = "Tek hücrelik stiller alfabetik sıradadır, varsayılan Arc'tır; her stil gömülü bir hücre animasyonudur ve Spinner::animation(ad) başka herhangi birini oynatır. Arc Nerd Font modunda progress spinner karelerini kullanır, Quarters her zaman tek hücreye sığan çeyrek bloklarla çizilir, Slices Unicode modunda yarım dairelerle döner. Spinner::done(true) büyüyen bir tiki $success rengine karışarak bir kez oynatır ve onda kalır; hareket azaltılmışsa tik hemen görünür."

[[item]]
id       = "cell-animation"
name     = "Animation studio"
group    = "display"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "cell-animation"
types    = ["CellAnimation", "AnimationFrame", "CellColor", "FrameTime", "Playback", "ColorMode", "AnimationName", "AnimatedCell", "CellFrame"]
notes    = "One data type for every one-cell animation. Each frame carries a glyph per glyph mode (ASCII is required; Nerd Font falls back to Unicode, Unicode to ASCII) and an optional colour expression; playback loops, plays once or bounces, and a rest frame stands in for reduced motion. [animations.<name>] tables live in icon sets, and themes override them like icons. The studio page compares the built-ins in all three modes, edits working copies with a live preview and copies them as TOML."
notes-tr = "Her tek hücrelik animasyon için tek bir veri tipi. Her kare, her karakter modu için bir karakter (ASCII zorunlu; Nerd Font yoksa Unicode, o da yoksa ASCII kullanılır) ve isteğe bağlı bir renk ifadesi taşır; oynatma döngüyle, bir kez ya da gidip gelerek olur, azaltılmış hareket için bir duruş karesi vardır. [animations.<ad>] tabloları ikon setlerinde yaşar ve temalar onları ikonlar gibi değiştirir. Stüdyo sayfası gömülü animasyonları üç modda karşılaştırır, çalışma kopyalarını canlı önizlemeyle düzenler ve TOML olarak kopyalar."

