notes-tr = "Başka bir yere tıklamak listeyi kapatır ve tıklama hedefine yine ulaşır; bileşenin kendi alanına tıklamak yalnızca kapatır. Tek bir vurgu vardır ve fare onu yalnızca kendisi hareket ettiğinde taşır. Kaydırma çubuğu sürüklenebilir."

