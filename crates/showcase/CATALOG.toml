name     = "Confirmation"
group    = "overlays"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "confirm"
types    = ["Confirm"]
notes    = "Esc and the close mark cancel together; dismissable(false) leaves only the buttons. It has the same full-height pillar as every dialog. alternative(label, message) adds a third, plain button between Cancel and the confirm button for questions such as Discard, Continue, Save; Cancel keeps the focus and Tab visits the buttons left to right. Without it the two-button dialog is unchanged."
notes-tr = "Esc ve kapatma işareti birlikte vazgeçer; dismissable(false) yalnızca butonları bırakır. Her pencerede olduğu gibi tam boy sol çubuğu vardır. alternative(etiket, mesaj) At, Sürdür, Kaydet gibi sorular için Vazgeç ile onay butonu arasına üçüncü, düz bir buton ekler; odak Vazgeç'te kalır, Tab butonları soldan sağa gezer. Verilmezse iki butonlu pencere değişmez."

[[item]]
