[[item]]
id       = "file-picker"
name     = "File and folder picker"
group    = "forms"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "file-picker"
types    = ["FilePicker", "FileBrowser", "FileEntry", "FilePickerMsg", "Listing", "ListingError", "PickMode", "read_folder"]
notes    = "Opening a folder keeps the shown folder, with its path, entries, filter, selection and focus, until the answer arrives, then swaps it in one frame; FileBrowser::loading() names the folder on its way. A small spinner after the path appears only after 300 ms and stays at least 500 ms, so quick reads never flash, while errors show at once. In the playground, Slow disk makes every read take a second. The wrap argument of FilePicker::new, open and update is any function or closure, so a screen can pass its own conversion; a plain function still works unchanged."
notes-tr = "Klasör açmak, gösterilen klasörü yolu, girdileri, süzgeci, seçimi ve odağıyla birlikte cevap gelene kadar korur, sonra tek karede değiştirir; FileBrowser::loading() yoldaki klasörü bildirir. Yolun ardındaki küçük spinner yalnızca 300 ms sonra belirir ve en az 500 ms kalır, böylece hızlı okumalar ekranda yanıp sönmez; hatalar ise hemen görünür. Oyun alanındaki Yavaş disk her okumanın bir saniye sürmesini sağlar. FilePicker::new, open ve update'in sar bağımsız değişkeni herhangi bir fonksiyon ya da kapanıştır, böylece bir ekran kendi dönüşümünü verebilir; düz fonksiyon da değişmeden çalışır."

[[item]]
id       = "storage"
name     = "Settings storage"
group    = "foundations"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "storage"
types    = ["Settings", "Schema", "SettingKind", "Setting", "SettingValue"]
notes    = "An optional schema heals settings files: unknown keys are removed, invalid values get their default, each repair is a located warning and the old file is kept as settings.toml.bak. Schema::optional declares a key without a default that is kept only when valid and never added. Schema::open(prefix) keeps every key under a table as it is, while declared rules under it still apply. Missing keys use their default and are not written."
notes-tr = "İsteğe bağlı bir şema ayar dosyalarını onarır: bilinmeyen anahtarlar silinir, geçersiz değerler varsayılanını alır, her onarım yeri belirtilen bir uyarıdır ve eski dosya settings.toml.bak olarak saklanır. Schema::optional varsayılanı olmayan, yalnızca geçerliyse tutulan ve hiçbir zaman eklenmeyen bir anahtar tanımlar. Schema::open(önek) bir tablonun altındaki her anahtarı olduğu gibi bırakır, altında tanımlanan kurallar yine uygulanır. Eksik anahtarlar varsayılanlarını kullanır ve dosyaya yazılmaz."

[[item]]
id       = "date-time"
name     = "Date and time"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "date-time"
types    = ["Date", "DateTime", "TimeOfDay", "Weekday", "Uptime", "local_offset", "local_offset_minutes", "is_leap_year", "days_in_month"]
notes    = "Two monotonic clocks, not a wall clock, tell time worked from time the machine slept: their difference is exactly the sleep, and no clock correction can fake it. Only Linux and Android offer the pair, so Uptime::detects_suspend() says so and the numbers stay honest elsewhere. The local offset is read from the system time zone file the way the platform reads it, and local_offset() returns None rather than pretending UTC is local."
notes-tr = "Çalışılan süreyi uykuda geçen süreden duvar saati değil iki tekdüze saat ayırır: farkları tam olarak uykudur ve saat düzeltmesi bunu yanıltamaz. Bu çifti yalnızca Linux ve Android sunar, bu yüzden Uptime::detects_suspend() durumu söyler ve diğer platformlarda sayı uydurulmaz. Yerel fark, sistemin saat dilimi dosyasından platformun okuduğu gibi okunur; local_offset() UTC'yi yerelmiş gibi göstermek yerine None döner."

[[item]]
id       = "app-folders"
name     = "Application folders"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "storage"
types    = ["config_dir", "data_dir"]
notes    = "Settings and data are two folders, because a recorded session is not a setting: XDG_CONFIG_HOME and XDG_DATA_HOME on Linux and other Unix systems, the roaming and the local AppData on Windows, and on macOS the same Application Support folder for both, since macOS has no split for a command line application. An absolute XDG variable wins, a relative one is invalid and ignored, a HOME that is not absolute counts as missing so nothing lands under the working directory, and None means the platform gives no folder at all, so the application keeps everything in memory. Asking does not create the folder."
notes-tr = "Ayar ile veri iki ayrı klasördür, çünkü kaydedilmiş bir oturum ayar değildir: Linux ve diğer Unix sistemlerinde XDG_CONFIG_HOME ile XDG_DATA_HOME, Windows'ta dolaşan ve yerel AppData, macOS'ta ise ikisi için aynı Application Support klasörü, çünkü macOS bir komut satırı uygulaması için ayrım yapmaz. Mutlak bir XDG değişkeni kazanır, göreli olan geçersizdir ve yok sayılır, mutlak olmayan bir HOME yok sayılır ve hiçbir şey çalışma klasörünün altına düşmez, None ise platformun hiç klasör vermediğini söyler; uygulama o zaman her şeyi bellekte tutar. Sormak klasörü oluşturmaz."

[[item]]
id       = "atomic-write"
name     = "Atomic write"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "storage"
types    = ["atomic_write", "atomic_write_reporting", "WriteStep"]
notes    = "Write a temporary file in the same folder, flush the file, rename it over the real name, then flush the folder. The last step is the one that is usually forgotten: without it a power cut can lose the rename, and then both names are gone. The temporary file shares the folder because a rename cannot cross a file system, and it carries the process id and a counter, so two writers never pick the same name. A failed step removes it again. On platforms where the standard library cannot open a folder, Windows among them, the folder is not flushed and WriteStep::SyncedDirectory is not reported; doing better needs calls this framework cannot make without unsafe. A path that is a symbolic link is written through: the file it points at is replaced in its own folder and keeps its permissions, and the link stays a link, so settings linked from a dotfiles repository stay that repository's file."
notes-tr = "Aynı klasöre geçici bir dosya yaz, dosyayı diske indir, gerçek adın üzerine taşı, sonra klasörü diske indir. Genelde atlanan adım sonuncusudur: o olmadan bir elektrik kesintisi yeniden adlandırmayı kaybedebilir ve iki ad da gider. Geçici dosya aynı klasördedir, çünkü yeniden adlandırma dosya sistemi sınırını geçemez; adında süreç kimliği ve bir sayaç taşır, böylece iki yazıcı aynı adı seçmez. Adımlardan biri başarısız olursa dosya silinir. Standart kütüphanenin bir klasörü açamadığı platformlarda, Windows dahil, klasör diske indirilmez ve WriteStep::SyncedDirectory bildirilmez; daha iyisi bu framework'ün unsafe olmadan yapamadığı çağrıları ister. Sembolik bağ olan bir yol üzerinden yazılır: bağın gösterdiği dosya kendi klasöründe değişir ve izinlerini korur, bağ bağ olarak kalır; dotfiles deposundan bağlanan ayarlar o deponun dosyası olarak kalır."

[[item]]
id       = "app-lock"
name     = "One instance at a time"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "storage"
types    = ["AppLock", "holder_pid"]
notes    = "An advisory lock the kernel holds for the running process: flock(LOCK_EX | LOCK_NB) on Unix, through the rustix crossterm already brings in. A crash never leaves a stale lock, because the kernel releases it when the process dies, and dropping the value releases it too. Ok(None) means another holder has it; that answer is the only thing a decision may rest on. The process id in the file is diagnostic text, since a process id is reused. A flock belongs to an open file, not to a process, so a second acquire inside one process is told the lock is taken as well. On platforms without an advisory lock here, Windows among them, acquire returns an Unsupported error and never Ok, so an application is told it has no lock instead of quietly running without one."
notes-tr = "Çekirdeğin çalışan süreç için tuttuğu bir danışma kilidi: Unix'te flock(LOCK_EX | LOCK_NB), crossterm'in zaten getirdiği rustix üzerinden. Çökme bayat kilit bırakmaz, çünkü süreç ölünce çekirdek kilidi salar; değeri düşürmek de salar. Ok(None) kilidi başkasının tuttuğunu söyler ve karar yalnızca bu cevaba dayanabilir. Dosyadaki süreç kimliği tanı metnidir, çünkü süreç kimlikleri yeniden kullanılır. Bir flock sürece değil açık dosyaya aittir, bu yüzden aynı süreçteki ikinci deneme de kilidin alınmış olduğunu duyar. Burada danışma kilidi olmayan platformlarda, Windows dahil, acquire Unsupported hatası döner ve asla Ok olmaz; uygulama sessizce kilitsiz çalışmak yerine kilidi olmadığını öğrenir."

[[item]]
id       = "machine-name"
name     = "Machine name"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "storage"
types    = ["machine_name"]
notes    = "One file per machine in a folder several machines sync, so two machines never overwrite each other's counters: running-<machine>.toml. The name is the node name uname -n prints, read through the rustix crossterm already brings in, and COMPUTERNAME on Windows. It comes back ready for a file name: whitespace around it is removed, every character other than a letter or digit of any script, -, _ and . becomes -, and dots at either end are dropped, since a leading dot hides a file and Windows drops a trailing one. None means nothing is left, so the application picks a name of its own instead of writing running-.toml. The unchanged system name is not offered: nothing needs it yet."
notes-tr = "Birkaç makinenin eşitlediği bir klasörde makine başına bir dosya; böylece iki makine birbirinin sayacının üzerine yazmaz: running-<makine>.toml. Ad, uname -n'nin yazdığı düğüm adıdır ve crossterm'in zaten getirdiği rustix üzerinden okunur; Windows'ta COMPUTERNAME. Dosya adına hazır gelir: çevresindeki boşluk atılır, her yazıdan harf ve rakam ile -, _ ve . dışındaki her karakter - olur, iki uçtaki noktalar düşer, çünkü baştaki nokta dosyayı gizler ve Windows sondakini siler. None geriye bir şey kalmadığını söyler; uygulama running-.toml yazmak yerine kendi adını seçer. Sistemin değiştirilmemiş adı sunulmaz: henüz ona ihtiyaç duyan yok."

[[item]]
id       = "input-idleness"
name     = "Input idleness"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "date-time"
types    = ["idle_for", "on_idle"]
notes    = "How long no input has reached this terminal, for an application that never sees keys itself. Keys (press, repeat, release), every mouse event including the pointer moving over the window, pastes and the end of a handoff count; a resize, messages and background work do not. Before any input the silence counts from the start. ui.idle_for() reads it and keeps a view that shows it current by drawing again on each whole second, only while it is read. ui.on_idle(after, message) wakes the application exactly when the silence reaches after, with message(true), and again with message(false) at the first input, before the input reaches a widget. System-wide idleness is out of reach on purpose."
notes-tr = "Tuşları hiç görmeyen bir uygulama için bu terminale ne kadar süredir girdi gelmediği. Tuşlar (basma, tekrar, bırakma), imlecin pencere üzerinde gezinmesi dahil her fare olayı, yapıştırma ve bir devrin sonu sayılır; yeniden boyutlandırma, mesajlar ve arka plan işleri sayılmaz. Hiç girdi gelmeden önce sessizlik başlangıçtan sayılır. ui.idle_for() onu okur ve onu gösteren görünümü, yalnızca okunduğu sürece, her tam saniyede yeniden çizerek güncel tutar. ui.on_idle(after, message) uygulamayı sessizlik after'a ulaştığı anda message(true) ile, ilk girdide de, girdi bir bileşene ulaşmadan önce, message(false) ile uyandırır. Sistem genelindeki boşta kalma bilerek kapsam dışıdır."

[[item]]
id       = "page-transitions"
name     = "Page transitions"
group    = "foundations"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "page-transitions"
types    = ["PageTransition"]
notes    = "Pages cross-fade cell by cell, optionally with a short slide that follows the navigation direction, built on motion; the duration is the theme's motion.page, and reduced motion shows the new page at once. Layers (modal pop, toast slide-in, dropdown unfold) animate inside their own widgets."
notes-tr = "Sayfalar hücre hücre çapraz geçişle değişir, istenirse gezinme yönünü izleyen kısa bir kaymayla; motion üstüne kuruludur. Süre temanın motion.page değeridir, hareket azaltılınca yeni sayfa hemen görünür. Katmanlar (modal pop, bildirimin kayarak girişi, açılır listenin serilmesi) kendi bileşenlerinin içinde hareket eder."

[[item]]
id       = "text-selection"
name     = "Mouse text selection"
group    = "foundations"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "text-selection"
notes    = "Nothing is selectable unless a widget asks for it, and the selection region is that widget. Releasing the mouse copies nothing; ctrl c copies clean text and right click offers Copy and Raw copy."
notes-tr = "Bir bileşen istemedikçe hiçbir yer seçilemez ve seçim bölgesi o bileşendir. Fareyi bırakmak bir şey kopyalamaz; ctrl c temiz metni kopyalar, sağ tık Kopyala ve Ham kopyala seçeneklerini sunar."

[[item]]
id       = "example-setup-wizard"
name     = "Setup wizard"
group    = "examples"
kind     = "example"
priority = "p2"
status   = "done"
