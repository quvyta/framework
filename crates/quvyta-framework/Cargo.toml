[package]
name = "quvyta-framework"
description = "A Rust framework for building terminal applications"
repository = "https://github.com/quvyta/framework"
readme = "../../README.md"
keywords = ["tui", "terminal", "framework", "widgets", "theme"]
categories = ["command-line-interface"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The crate is published as quvyta-framework and used in code as `qframe`.
name = "qframe"

[lints]
workspace = true

[dependencies]
crossterm = { version = "0.29.0", features = ["osc52"] }
portable-pty = { version = "0.9.0", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui-core = { version = "0.1.2", features = ["std"] }
ratatui-crossterm = "0.1.2"
sys-locale = "0.3.2"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "preserve_order"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vt100 = { version = "0.16.2", optional = true }

[features]
# The embedded terminal: a shell in a pseudo-terminal, parsed into theme-coloured cells.
pty = ["dep:portable-pty", "dep:vt100"]
