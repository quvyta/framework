month-6 = "Junho"
month-7 = "Julho"
month-8 = "Agosto"
month-9 = "Setembro"
month-10 = "Outubro"
month-11 = "Novembro"
month-12 = "Dezembro"
# Inside a date the month is written in lower case: 5 de janeiro de 2026.
month-in-date-1 = "janeiro"
