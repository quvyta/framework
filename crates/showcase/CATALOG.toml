[[item]]
id       = "file-picker"
name     = "File and folder picker"
group    = "forms"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "file-picker"
types    = ["FilePicker", "FileBrowser", "FileEntry", "FilePickerMsg", "Listing", "ListingError", "PickMode", "read_folder"]
notes    = "Opening a folder keeps the shown folder, with its path, entries, filter, selection and focus, until the answer arrives, then swaps it in one frame; FileBrowser::loading() names the folder on its way. A small spinner after the path appears only after 300 ms and stays at least 500 ms, so quick reads never flash, while errors show at once. In the playground, Slow disk makes every read take a second. The wrap argument of FilePicker::new, open and update is any function or closure, so a screen can pass its own conversion; a plain function still works unchanged."
notes-tr = "Klasör açmak, gösterilen klasörü yolu, girdileri, süzgeci, seçimi ve odağıyla birlikte cevap gelene kadar korur, sonra tek karede değiştirir; FileBrowser::loading() yoldaki klasörü bildirir. Yolun ardındaki küçük spinner yalnızca 300 ms sonra belirir ve en az 500 ms kalır, böylece hızlı okumalar ekranda yanıp sönmez; hatalar ise hemen görünür. Oyun alanındaki Yavaş disk her okumanın bir saniye sürmesini sağlar. FilePicker::new, open ve update'in sar bağımsız değişkeni herhangi bir fonksiyon ya da kapanıştır, böylece bir ekran kendi dönüşümünü verebilir; düz fonksiyon da değişmeden çalışır."

[[item]]
id       = "file-manager"
name     = "File manager"
group    = "content"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "file-manager"
types    = ["FileManager", "FileManagerState", "FileManagerMsg", "FileView", "FileDetails", "FileWork", "FolderEntry", "FileChange", "FileError", "NameProblem", "Naming", "NameFor", "RowMark", "child_key", "copy_into", "is_inside", "is_within", "name_of", "parent_key"]
notes    = "A file view, not an application: it reads the folder, draws it, does the file operations and says what happened; what opening a file means is always the application's, through on_open(path). Carried over from qcode's file tree, which had been in use for months, so every rule in it was kept: a folder is read in the background and never while drawing, folders first then files each in name order, an entry whose name is not valid text still shown, keys written relative to the root with / on every platform, a cut entry faint until it is pasted or let go, a refused operation said entry by entry. The root is the top row, so the folder itself has a place for its menu, reached by a right click or by the menu key like any other row. Reading shows its indicator on the folder's own row under the tree's 300/500 ms rule rather than replacing the whole widget with a spinner, so a quick read never flashes. confined() keeps every operation inside the root and refuses a path through a symbolic link: it belongs to the state the operations run from, not to the view, which is rebuilt every frame. following(true) adds a FolderWatch on exactly the folders on screen; it is off by default because the wait belongs to a manager somebody is looking at. Ten thousand entries cost what two hundred do: only the visible rows are painted, and a tree row reads no size, date or permissions at all. row_mark(|key| RowMark) is how an application says what the manager cannot know: a sign in a tone and a faint row, for an entry a backup leaves out or a version control system ignores. RowMark::sign takes the icon and the colour together, so a status colour cannot be given without a sign, and a mark never makes a row louder than the manager's own states. Copying stands beside moving: Copy puts entries aside the way Cut does and Paste copies them, a folder with everything in it, a link as a link, and what was copied stays where it is. trashing() and trashing_in(folder) make deleting put an entry in a trash written the way the freedesktop specification says, and because a trash is a rename it has a limit: an entry on another file system, or a run with no trash at all, is never deleted quietly - the manager asks whether to delete it for good, as its own danger-coloured question. showing_hidden(bool) shows the dotfiles, which are read with every folder either way, so a new name is checked against a hidden one whether it is shown or not. Refusals speak the person's language rather than the system's: FileManagerMsg::Listed carries a FileError rather than words, so a folder nobody may look into says so instead of handing on the system's own error number. A copy is the one operation with no upper bound, so it runs on the framework's task machinery rather than holding a thread: FileWork says how far it has come, a row above the rows names it and offers Stop, and stopping takes the half-written entry away again while what was already copied stays. view(FileView::Tree | List | Icons) is the shape: folders inside folders, one folder as rows with size, date and permissions, or one folder as a grid of icons. A flat view shows the folder state.folder() names, with that folder's own row at the top, which carries its menu and is the way back out of it; the keys, the menus and every operation are the same in all three. The details a list shows are read a page at a time - two hundred entries around the cursor, asked for by the view while it draws and remembered once they come - so a folder of ten thousand entries is never ten thousand calls to the system, and the tree and the icons ask for nothing at all. Table and CardGrid each gained a context menu of their own row (context_menu(|index| ..)), which is what the flat views are built on: a single menu around the widget would act on the row the cursor rests on rather than the row that was clicked, which in a file manager means deleting the wrong file."
notes-tr = "Bu bir uygulama değil, bir dosya görünümüdür: klasörü okur, çizer, dosya işlemlerini yapar ve ne olduğunu söyler; bir dosyanın nasıl açılacağına her zaman uygulama karar verir (on_open(yol)). qcode'un aylardır kullanılan dosya ağacından taşındı, bu yüzden içindeki her kural korundu: klasör arka planda okunur, çizim sırasında asla okunmaz; önce klasörler sonra dosyalar, her biri ad sırasında; adı geçerli metin olmayan girdi de gösterilir; anahtarlar her platformda köke göre / ile yazılır; kesilen girdi yapıştırılana ya da bırakılana kadar soluktur; reddedilen işlem girdi girdi anlatılır. Kök en üstteki satırdır, böylece klasörün kendi menüsü için bir yeri olur; sağ tıkla ya da menü tuşuyla, her satır gibi. Okuma göstergesi bütün bileşeni bir spinner'a çevirmek yerine klasörün kendi satırında, ağacın 300/500 ms kuralıyla belirir; hızlı okuma ekranda yanıp sönmez. confined() her işlemi kökün içinde tutar ve sembolik bağdan geçen yolu reddeder; bu kural her karede yeniden kurulan görünüme değil, işlemlerin çalıştığı duruma aittir. following(true) tam olarak ekrandaki klasörlere bir FolderWatch kurar; varsayılan olarak kapalıdır, çünkü bekleyiş birinin baktığı bir yöneticiye aittir. On bin girdi iki yüz girdi kadar tutar: yalnızca görünen satırlar boyanır ve ağaç satırı boyut, tarih ya da izin diye hiçbir şey okumaz. row_mark(|key| RowMark), uygulamanın yöneticinin bilemediğini söyleme yoludur: tonlu bir işaret ve solgun bir satır; yedeğe girmeyen ya da sürüm denetiminin yok saydığı bir girdi için. RowMark::sign ikonu ve rengi birlikte alır, böylece durum rengi işaretsiz verilemez; işaret satırı yöneticinin kendi hâllerinden daha gür yapamaz. Kopyalama taşımanın yanında durur: Copy girdileri Cut gibi kenara koyar, Paste onları kopyalar; klasör içindeki her şeyle, bağ bağ olarak, kopyalanan yerinde kalarak. trashing() ve trashing_in(klasör) silmeyi, freedesktop belirtiminin dediği gibi yazılan bir çöp kutusuna atmaya çevirir; çöpe atmak bir yeniden adlandırma olduğu için bir sınırı vardır: başka dosya sistemindeki ya da hiç çöpü olmayan bir girdi sessizce silinmez, yönetici kalıcı silmeyi kendi tehlike renkli sorusuyla sorar. showing_hidden(bool) nokta dosyalarını gösterir; onlar her okumayla zaten gelir, bu yüzden yeni bir ad gizli bir adla çakışıyorsa gösterilmese de yakalanır. Reddetmeler sistemin değil kişinin dilini konuşur: FileManagerMsg::Listed kelime değil FileError taşır, böylece içine bakılamayan klasör sistemin hata numarası yerine bunu söyler. Kopyalamanın üst sınırı olmadığı için bir iş parçacığı tutmak yerine framework'ün iş düzeneğinde çalışır: FileWork nereye geldiğini söyler, satırların üstündeki bir satır işi adlandırır ve Durdur sunar, durdurmak yarı yazılmış girdiyi geri alır, kopyalanmış olan kalır. view(FileView::Tree | List | Icons) biçimi söyler: klasör içinde klasör; tek klasör, boyut, tarih ve izinleriyle satır satır; ya da tek klasör, simge ızgarası. Düz görünüm state.folder()'ın söylediği klasörü gösterir ve en üstte o klasörün kendi satırı durur: menüsü oradadır ve klasörden çıkmanın yoludur. Tuşlar, menüler ve bütün işlemler üç biçimde de aynıdır. Listenin gösterdiği ayrıntı sayfa sayfa okunur - imlecin çevresinde iki yüz girdi, görünüm çizerken ister, gelen saklanır - böylece on bin girdilik klasör on bin sisteme çağrı olmaz; ağaç ile simgeler hiç sormaz. Table ve CardGrid kendi satır menüsünü kazandı (context_menu(|index| ..)); düz görünümler bunun üstüne kuruldu, çünkü bileşeni saran tek bir menü tıklanan satıra değil imlecin durduğu satıra iş yapardı ve bir dosya yöneticisinde bu, yanlış dosyayı silmek demektir."

[[item]]
id       = "storage"
name     = "Settings storage"
group    = "foundations"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "storage"
types    = ["Settings", "Schema", "SettingKind", "Setting", "SettingValue"]
notes    = "An optional schema heals settings files: unknown keys are removed, invalid values get their default, each repair is a located warning and the old file is kept next to it with .bak added to its whole name (settings.toml.bak, code.conf.bak), so a backup never takes the name another file could have. Schema::optional declares a key without a default that is kept only when valid and never added. Schema::open(prefix) keeps every key under a table as it is, while declared rules under it still apply. Missing keys use their default and are not written."
notes-tr = "İsteğe bağlı bir şema ayar dosyalarını onarır: bilinmeyen anahtarlar silinir, geçersiz değerler varsayılanını alır, her onarım yeri belirtilen bir uyarıdır ve eski dosya tam adına .bak eklenerek yanında saklanır (settings.toml.bak, code.conf.bak); böylece yedek başka bir dosyanın alabileceği adı almaz. Schema::optional varsayılanı olmayan, yalnızca geçerliyse tutulan ve hiçbir zaman eklenmeyen bir anahtar tanımlar. Schema::open(önek) bir tablonun altındaki her anahtarı olduğu gibi bırakır, altında tanımlanan kurallar yine uygulanır. Eksik anahtarlar varsayılanlarını kullanır ve dosyaya yazılmaz."

[[item]]
id       = "date-time"
name     = "Date and time"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "date-time"
types    = ["Date", "DateTime", "TimeOfDay", "Weekday", "Uptime", "local_offset", "local_offset_minutes", "is_leap_year", "days_in_month"]
notes    = "Two monotonic clocks, not a wall clock, tell time worked from time the machine slept: their difference is exactly the sleep, and no clock correction can fake it. Only Linux and Android offer the pair, so Uptime::detects_suspend() says so and the numbers stay honest elsewhere. The local offset is read from the system time zone file the way the platform reads it, and local_offset() returns None rather than pretending UTC is local."
notes-tr = "Çalışılan süreyi uykuda geçen süreden duvar saati değil iki tekdüze saat ayırır: farkları tam olarak uykudur ve saat düzeltmesi bunu yanıltamaz. Bu çifti yalnızca Linux ve Android sunar, bu yüzden Uptime::detects_suspend() durumu söyler ve diğer platformlarda sayı uydurulmaz. Yerel fark, sistemin saat dilimi dosyasından platformun okuduğu gibi okunur; local_offset() UTC'yi yerelmiş gibi göstermek yerine None döner."

[[item]]
id       = "app-folders"
name     = "Application folders"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "storage"
types    = ["config_dir", "data_dir", "state_dir", "cache_dir"]
notes    = "Settings and data are two folders, because a recorded session is not a setting: XDG_CONFIG_HOME and XDG_DATA_HOME on Linux and other Unix systems, the roaming and the local AppData on Windows, and on macOS the same Application Support folder for both, since macOS has no split for a command line application. An absolute XDG variable wins, a relative one is invalid and ignored, a HOME that is not absolute counts as missing so nothing lands under the working directory, and None means the platform gives no folder at all, so the application keeps everything in memory. Asking does not create the folder. state_dir and cache_dir follow the same rules for what an application remembers between runs and what it can rebuild: XDG_STATE_HOME or ~/.local/state and XDG_CACHE_HOME or ~/.cache on Linux, Application Support and Library/Caches on macOS, the local AppData on Windows; Family::state_dir(app) and Family::cache_dir(app) put a member under the family folder in each, such as ~/.cache/quvyta/packages."
notes-tr = "Ayar ile veri iki ayrı klasördür, çünkü kaydedilmiş bir oturum ayar değildir: Linux ve diğer Unix sistemlerinde XDG_CONFIG_HOME ile XDG_DATA_HOME, Windows'ta dolaşan ve yerel AppData, macOS'ta ise ikisi için aynı Application Support klasörü, çünkü macOS bir komut satırı uygulaması için ayrım yapmaz. Mutlak bir XDG değişkeni kazanır, göreli olan geçersizdir ve yok sayılır, mutlak olmayan bir HOME yok sayılır ve hiçbir şey çalışma klasörünün altına düşmez, None ise platformun hiç klasör vermediğini söyler; uygulama o zaman her şeyi bellekte tutar. Sormak klasörü oluşturmaz. state_dir ve cache_dir, uygulamanın iki açılış arasında hatırladıkları ve yeniden kurabileceği dosyalar için aynı kurallara uyar: Linux'ta XDG_STATE_HOME ya da ~/.local/state ile XDG_CACHE_HOME ya da ~/.cache, macOS'ta Application Support ve Library/Caches, Windows'ta yerel AppData; Family::state_dir(app) ve Family::cache_dir(app) bir üyeyi her birinde ailenin klasörü altına koyar, örneğin ~/.cache/quvyta/packages."

[[item]]
id       = "atomic-write"
name     = "Atomic write"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "storage"
types    = ["atomic_write", "atomic_write_reporting", "WriteStep"]
notes    = "Write a temporary file in the same folder, flush the file, rename it over the real name, then flush the folder. The last step is the one that is usually forgotten: without it a power cut can lose the rename, and then both names are gone. The temporary file shares the folder because a rename cannot cross a file system, and it carries the process id and a counter, so two writers never pick the same name. A failed step removes it again. On platforms where the standard library cannot open a folder, Windows among them, the folder is not flushed and WriteStep::SyncedDirectory is not reported; doing better needs calls this framework cannot make without unsafe. A path that is a symbolic link is written through: the file it points at is replaced in its own folder and keeps its permissions, and the link stays a link, so settings linked from a dotfiles repository stay that repository's file."
notes-tr = "Aynı klasöre geçici bir dosya yaz, dosyayı diske indir, gerçek adın üzerine taşı, sonra klasörü diske indir. Genelde atlanan adım sonuncusudur: o olmadan bir elektrik kesintisi yeniden adlandırmayı kaybedebilir ve iki ad da gider. Geçici dosya aynı klasördedir, çünkü yeniden adlandırma dosya sistemi sınırını geçemez; adında süreç kimliği ve bir sayaç taşır, böylece iki yazıcı aynı adı seçmez. Adımlardan biri başarısız olursa dosya silinir. Standart kütüphanenin bir klasörü açamadığı platformlarda, Windows dahil, klasör diske indirilmez ve WriteStep::SyncedDirectory bildirilmez; daha iyisi bu framework'ün unsafe olmadan yapamadığı çağrıları ister. Sembolik bağ olan bir yol üzerinden yazılır: bağın gösterdiği dosya kendi klasöründe değişir ve izinlerini korur, bağ bağ olarak kalır; dotfiles deposundan bağlanan ayarlar o deponun dosyası olarak kalır."

[[item]]
id       = "app-lock"
name     = "One instance at a time"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "storage"
types    = ["AppLock", "holder_pid"]
notes    = "An advisory lock the kernel holds for the running process: flock(LOCK_EX | LOCK_NB) on Unix, through the rustix crossterm already brings in. A crash never leaves a stale lock, because the kernel releases it when the process dies, and dropping the value releases it too. Ok(None) means another holder has it; that answer is the only thing a decision may rest on. The process id in the file is diagnostic text, since a process id is reused. A flock belongs to an open file, not to a process, so a second acquire inside one process is told the lock is taken as well. On platforms without an advisory lock here, Windows among them, acquire returns an Unsupported error and never Ok, so an application is told it has no lock instead of quietly running without one."
notes-tr = "Çekirdeğin çalışan süreç için tuttuğu bir danışma kilidi: Unix'te flock(LOCK_EX | LOCK_NB), crossterm'in zaten getirdiği rustix üzerinden. Çökme bayat kilit bırakmaz, çünkü süreç ölünce çekirdek kilidi salar; değeri düşürmek de salar. Ok(None) kilidi başkasının tuttuğunu söyler ve karar yalnızca bu cevaba dayanabilir. Dosyadaki süreç kimliği tanı metnidir, çünkü süreç kimlikleri yeniden kullanılır. Bir flock sürece değil açık dosyaya aittir, bu yüzden aynı süreçteki ikinci deneme de kilidin alınmış olduğunu duyar. Burada danışma kilidi olmayan platformlarda, Windows dahil, acquire Unsupported hatası döner ve asla Ok olmaz; uygulama sessizce kilitsiz çalışmak yerine kilidi olmadığını öğrenir."

[[item]]
id       = "instance-lock"
name     = "Wake when the last instance closes"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "storage"
types    = ["InstanceLock"]
notes    = "Many instances at once, and something that waits for the last of them: every instance holds InstanceLock::shared on one file, and a service calls InstanceLock::wait_exclusive on the same file, which sleeps in the kernel until the last shared lock is gone. try_exclusive asks without waiting and answers Ok(None) while anyone holds a lock. The kernel releases a flock when its process dies, so a crashed or killed instance keeps nobody waiting, and there is no count to keep right. shared waits only while the exclusive lock is held, so an instance that starts during the service's cleanup waits for it instead of running into it. On Unix: flock LOCK_SH, LOCK_EX | LOCK_NB and LOCK_EX through rustix, on a file the standard library opens close-on-exec; interrupted waits resume. The wait cannot be cancelled and returns at once when nobody runs, so a service waits once per group of instances. A separate type from AppLock, because the question is different and so is the file. Other platforms get an Unsupported error, as for AppLock."
notes-tr = "Aynı anda birçok örnek ve sonuncusunu bekleyen bir şey: her örnek bir dosyada InstanceLock::shared tutar, bir servis aynı dosyada InstanceLock::wait_exclusive çağırır; bu, son paylaşılan kilit gidene kadar çekirdekte uyur. try_exclusive aynı soruyu beklemeden sorar ve biri kilit tuttuğu sürece Ok(None) döner. Süreç ölünce çekirdek flock'u bırakır; çöken ya da öldürülen örnek kimseyi bekletmez ve doğru tutulması gereken bir sayaç yoktur. shared yalnızca özel kilit tutulurken bekler; servisin temizliği sırasında açılan bir örnek temizliğin içine düşmek yerine onu bekler. Unix'te rustix üzerinden, standart kütüphanenin exec'te kapanacak biçimde açtığı bir dosyada flock LOCK_SH, LOCK_EX | LOCK_NB ve LOCK_EX; kesilen beklemeler sürer. Bekleme iptal edilemez ve kimse çalışmıyorsa hemen döner, bu yüzden servis her örnek grubu için bir kez bekler. AppLock'tan ayrı bir tür, çünkü soru da dosya da farklı. Diğer platformlarda AppLock gibi Unsupported hatası döner."

[[item]]
id       = "folder-watch"
name     = "Folder watch"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "folder-watch"
types    = ["FolderWatch", "FolderChanges", "FolderChange", "FolderChangeKind"]
notes    = "Changes in a folder as the operating system reports them, never by polling: on Linux inotify, reached through the rustix crossterm already brings in, without unsafe. The watch is not recursive; an application watches the folders it shows open. FolderWatch is owned by the application and adds or removes folders; FolderChanges, cheap to clone, waits in a Command::perform: next() sleeps in the kernel until something happens, then gathers for a tenth of a second and returns the batch, oldest first, each change once, so a git checkout of thousands of files is a few batches. A change names its folder and entry: Created, Removed, Modified, Renamed { from } inside one folder, while a move between folders is a removal in one and a creation in the other. A queue overflow is Overflow for every watched folder, asking for a reread; a watched folder that is removed, moved away or unmounted is Gone once and no longer watched. The watch limit (fs.inotify.max_user_watches) is a QuotaExceeded error, a path that is not a folder an ordinary one. Dropping the watch wakes a waiting next(), which returns empty, as it does from then on. Other platforms get an Unsupported error from new(): macOS and Windows have event sources too, but none this framework reaches without unsafe or a large dependency, so an application rereads at moments of its own choosing there."
notes-tr = "Bir klasördeki değişiklikler, işletim sistemi bildirdiği anda, hiç yoklama yapmadan: Linux'ta inotify, crossterm'in zaten getirdiği rustix üzerinden, unsafe olmadan. İzleme özyinelemeli değildir; uygulama açık gösterdiği klasörleri izler. FolderWatch uygulamanındır, klasör ekler ve çıkarır; kopyalaması ucuz FolderChanges bir Command::perform içinde bekler: next() bir şey olana kadar çekirdekte uyur, sonra saniyenin onda biri kadar toplar ve topluluğu en eskisi önde, her değişikliği bir kez olmak üzere döndürür; binlerce dosyalık bir git checkout birkaç topluluk olur. Bir değişiklik klasörünü ve girdisini adlandırır: Created, Removed, Modified, bir klasör içinde Renamed { from }; klasörler arası taşıma birinde silinme, ötekinde oluşmadır. Kuyruk taşarsa izlenen her klasör için Overflow gelir ve yeniden okuma ister; silinen, başka yere taşınan ya da ayrılan bir izlenen klasör bir kez Gone olur ve artık izlenmez. İzleme sınırı (fs.inotify.max_user_watches) QuotaExceeded hatasıdır, klasör olmayan bir yol sıradan bir hata. İzlemeyi bırakmak bekleyen next()'i uyandırır; o boş döner ve bundan sonra hep öyle döner. Diğer platformlarda new() Unsupported hatası verir: macOS ve Windows'un da olay kaynakları var, ama bu framework hiçbirine unsafe ya da büyük bir bağımlılık olmadan ulaşamıyor; uygulama orada kendi seçtiği anlarda yeniden okur."

[[item]]
id       = "machine-name"
name     = "Machine name"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "storage"
types    = ["machine_name"]
notes    = "One file per machine in a folder several machines sync, so two machines never overwrite each other's counters: running-<machine>.toml. The name is the node name uname -n prints, read through the rustix crossterm already brings in, and COMPUTERNAME on Windows. It comes back ready for a file name: whitespace around it is removed, every character other than a letter or digit of any script, -, _ and . becomes -, and dots at either end are dropped, since a leading dot hides a file and Windows drops a trailing one. None means nothing is left, so the application picks a name of its own instead of writing running-.toml. The unchanged system name is not offered: nothing needs it yet."
notes-tr = "Birkaç makinenin eşitlediği bir klasörde makine başına bir dosya; böylece iki makine birbirinin sayacının üzerine yazmaz: running-<makine>.toml. Ad, uname -n'nin yazdığı düğüm adıdır ve crossterm'in zaten getirdiği rustix üzerinden okunur; Windows'ta COMPUTERNAME. Dosya adına hazır gelir: çevresindeki boşluk atılır, her yazıdan harf ve rakam ile -, _ ve . dışındaki her karakter - olur, iki uçtaki noktalar düşer, çünkü baştaki nokta dosyayı gizler ve Windows sondakini siler. None geriye bir şey kalmadığını söyler; uygulama running-.toml yazmak yerine kendi adını seçer. Sistemin değiştirilmemiş adı sunulmaz: henüz ona ihtiyaç duyan yok."

[[item]]
id       = "documents-folder"
name     = "Documents and workspace folders"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "storage"
types    = ["documents_dir"]
notes    = "The user's own work belongs where a file manager shows it, not in a hidden settings folder. On Linux the Documents folder has the name the desktop gave it in the user's language, ~/Belgeler on a Turkish desktop, so it is read from user-dirs.dirs in the config root the way that shell file is written: $HOME followed by a path or an absolute path, quoted, with # comments and backslash escapes and no other expansion, the last valid line winning. A missing or broken file, and a line that names the home folder itself, which is how that file turns a folder off, give ~/Documents. macOS uses ~/Documents; Windows asks for the Documents Known Folder, which the user can move to another drive, through the dirs crate, because that call needs unsafe and this crate forbids it. Family::workspace_dir(app_title) is <documents>/<family title>/<app title>, ~/Belgeler/Quvyta/Code. Asking creates nothing."
notes-tr = "Kullanıcının kendi işi gizli bir ayar klasöründe değil, dosya yöneticisinin gösterdiği yerde durur. Linux'ta Belgeler klasörünün adı masaüstünün kullanıcının dilinde verdiği addır, Türkçe bir masaüstünde ~/Belgeler; bu yüzden ayar kökündeki user-dirs.dirs dosyasından, o kabuk dosyasının yazıldığı gibi okunur: $HOME ve ardından bir yol ya da mutlak bir yol, tırnak içinde, # yorumları ve ters bölü kaçışlarıyla, başka hiçbir genişletme olmadan; son geçerli satır kazanır. Eksik ya da bozuk dosya ve ev klasörünün kendisini gösteren satır, ki o dosya bir klasörü böyle kapatır, ~/Documents verir. macOS ~/Documents kullanır; Windows kullanıcının başka bir sürücüye taşıyabildiği Belgeler Bilinen Klasörünü dirs crate'i üzerinden sorar, çünkü o çağrı unsafe ister ve bu crate onu yasaklar. Family::workspace_dir(uygulama adı) <belgeler>/<aile adı>/<uygulama adı> olur: ~/Belgeler/Quvyta/Code. Sormak hiçbir şey oluşturmaz."

[[item]]
id       = "app-family"
name     = "One settings folder for a family"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "storage"
types    = ["Family", "Migration"]
notes    = "Applications made to be used together keep their settings in one folder, so the user finds them in one place: ~/.config/quvyta/quvyta.conf is shared, code.conf belongs to code, and code/ beside it holds its other files. The folder is the lowercase id on Linux and other Unix systems and the title on macOS and Windows, where users read folder names as names; file names are always lowercase. Family::adopt(app, old folder) moves an application's settings there once at start: settings.toml becomes the app file and every other file keeps its place under the app folder. Each file is copied with its permissions, read back and compared before the old one is removed, a taken place is never overwritten or merged, symbolic links are left alone, emptied old folders are removed, and a second run changes nothing. Whatever stayed is a diagnostic in the report, which Settings::with_diagnostics shows next to what loading found."
notes-tr = "Birlikte kullanılmak için yapılmış uygulamalar ayarlarını tek klasörde tutar, kullanıcı onları tek yerde bulur: ~/.config/quvyta/quvyta.conf ortaktır, code.conf code'undur, yanındaki code/ onun diğer dosyalarını tutar. Klasör Linux ve diğer Unix sistemlerinde küçük harfli kimlik, macOS ve Windows'ta ise kullanıcıların klasör adlarını ad olarak okuduğu için başlıktır; dosya adları hep küçük harflidir. Family::adopt(uygulama, eski klasör) bir uygulamanın ayarlarını açılışta bir kez oraya taşır: settings.toml uygulama dosyası olur, diğer her dosya uygulama klasörünün altında aynı yerini alır. Her dosya izinleriyle kopyalanır, geri okunup karşılaştırılır ve eskisi ancak ondan sonra silinir; dolu bir yerin üzerine asla yazılmaz ve birleştirilmez, sembolik bağlara dokunulmaz, boşalan eski klasörler silinir ve ikinci çalıştırma hiçbir şeyi değiştirmez. Geride kalan her şey raporda bir tanıdır; Settings::with_diagnostics onu yüklemenin bulduklarının yanında gösterir."


[[item]]
id       = "shared-preferences"
name     = "Shared preferences"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "shared-preferences"
types    = ["Preferences", "Resolved", "Source", "Shared", "Scope"]
notes    = "Language, theme and icons are shared by the family: ~/.config/quvyta/quvyta.conf holds one value of each and every application's own file either names its own or says \"quvyta\", the family's id, to follow the shared one. Family::preferences(app, &i18n) resolves each key on its own: the application's value, else the shared file, else detection (I18n::detect, the theme always monochrome, the strongest icon set detect_glyph_mode allows); a missing key counts as \"quvyta\", so an old hand-written file follows too. The first application to start writes quvyta.conf with the detected values. A broken line is a located diagnostic and that key falls back to the detected value; \"quvyta\" inside quvyta.conf is reported as well. Resolved carries value and source (App, Family, Detected), so a settings screen can say where a value comes from. Family::set(app, key, value, Scope::Family) writes the shared file and puts \"quvyta\" in the application's file; Scope::App writes only the application's file; an application that chose its own value is never changed from another one. Family::follow(app, key) is the one way back: it writes the family's id in that application's file alone and neither reads nor writes the shared file, so a settings page that lists every member can put one member back on the shared value without changing what the whole family draws with; a key that already follows is left alone, and a file that cannot be read fails with InvalidData and stays as it was. Each write reads the file again right before writing, changes one key, holds the family folder with an advisory lock on Unix and writes atomically, so two applications changing different keys at once both keep theirs; comments do not survive, as with Settings::save. Settings::member_of(&family), which load_member does itself, keeps \"quvyta\" through a schema and self-healing, and theme() and language() read it as not set here, so Settings::apply leaves those keys to Runtime::preferences, which applies after Runtime::settings. Resolved carries where a value came from in a field named source rather than a from() method, which would read like the From conversion. The shared file is created by preferences; the setup wizard, which writes nothing when it is closed half-way, will need a resolution that does not write and adds it with its first user. The showcase's own header selectors stay on showcase.conf: flipping themes to review components must not change the user's other applications."
notes-tr = "Dil, tema ve ikonlar ailede ortaktır: ~/.config/quvyta/quvyta.conf her birinden bir değer tutar, her uygulamanın kendi dosyası ya kendi değerini ya da ortak değeri izlemek için ailenin kimliği olan \"quvyta\"yı yazar. Family::preferences(uygulama, &i18n) her anahtarı ayrı çözer: uygulamanın değeri, yoksa ortak dosya, o da yoksa algılama (I18n::detect, tema her zaman monochrome, ikonlarda detect_glyph_mode'un izin verdiği en güçlü set); eksik anahtar \"quvyta\" sayılır, böylece elle yazılmış eski dosya da izler. İlk açılan uygulama quvyta.conf'u algılanan değerlerle yazar. Bozuk satır yeri gösterilen bir tanıdır ve o anahtar algılanan değere düşer; quvyta.conf'un içindeki \"quvyta\" da bildirilir. Resolved değeri ve kaynağı (App, Family, Detected) taşır; ayar ekranı bir değerin nereden geldiğini söyleyebilir. Family::set(uygulama, anahtar, değer, Scope::Family) ortak dosyaya yazar ve uygulamanın dosyasına \"quvyta\" koyar; Scope::App yalnızca uygulamanın dosyasına yazar; kendi değerini seçmiş bir uygulama başka bir uygulamadan asla değişmez. Family::follow(uygulama, anahtar) tek dönüş yoludur: ailenin kimliğini yalnızca o uygulamanın dosyasına yazar, ortak dosyayı ne okur ne yazar; böylece her üyeyi listeleyen bir ayar sayfası, bütün ailenin çizdiği değeri değiştirmeden bir üyeyi ortak değere döndürebilir. Zaten izleyen anahtara dokunulmaz; okunamayan dosya InvalidData ile başarısız olur ve olduğu gibi kalır. Her yazma dosyayı yazmadan hemen önce yeniden okur, tek anahtarı değiştirir, Unix'te aile klasörünü bir danışma kilidiyle tutar ve atomik yazar; farklı anahtarları aynı anda değiştiren iki uygulama da değişikliğini korur; Settings::save'deki gibi yorumlar korunmaz. load_member'ın kendisi de yaptığı Settings::member_of(&aile), \"quvyta\"yı şemadan ve kendini onarmadan geçirir; theme() ve language() onu burada ayarlanmamış diye okur, böylece Settings::apply bu anahtarları Runtime::settings'ten sonra uygulanan Runtime::preferences'a bırakır. Resolved bir değerin nereden geldiğini from() metodu yerine source adlı bir alanda taşır; from, From dönüşümü gibi okunurdu. Ortak dosyayı preferences oluşturur; yarıda kapatılınca hiçbir şey yazmayan kurulum sihirbazı, yazmayan bir çözüme ihtiyaç duyacak ve onu ilk kullanıcısıyla ekleyecek. Showcase'in kendi başlık seçicileri showcase.conf'ta kalır: bileşenleri incelemek için tema değiştirmek kullanıcının diğer uygulamalarını değiştirmemeli."
[[item]]
id       = "update-notice"
name     = "Update notice"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "shared-preferences"
types    = ["UpdateCheck", "Update", "UpdateCheckRequest"]
notes    = "A person who does not know they run an old version cannot connect the trouble they meet to that version, and an old copy on a second machine is easy to forget; so every member of the family says when a newer version of itself is out, and the notice is on by default. UpdateCheck::new(family, app, package, current, on_newer) with Command::check_for_update asks crates.io's sparse index, the one cargo install reads, whether a newer version of the package is published. It asks on a thread of its own, so the first frame never waits, and at most once a day: the time of the last question is kept in the application's state folder and written before asking, so a question that fails waits for the next day as one that succeeds does, and a question that cannot be remembered is not asked, since it would be asked at every start. No network, no answer within ten seconds or an index that cannot be read is silence; yanked versions and pre-releases are passed over, and a build newer than the registry says nothing. What goes out is the package's name: the request carries no identity, no machine detail and no use of the application, and its User-Agent is the package and its version. The switch is the family's, not the application's: update-notice in quvyta.conf, shown by Appearance::updates right after the Appearance section in an application that asks, and left out by one that does not, so no settings page offers a switch that does nothing there (and the settings pages that already exist keep their layout), on while the key is missing, and off means nothing is asked and nothing written. Update::toast() is the notice every member shows the same way, the new version, the running one and how to update, from the family's launcher or with cargo install. The network code sits behind the updates feature, so a member that does not ask carries none of it; ureq with rustls only, the client qcode already builds. A Harness never reaches the network nor the check's folders: it records the question (update_checks) and answers it with set_latest_version, the same rule as Handoff and Command::open, so an application's own tests cannot ping crates.io by accident."
notes-tr = "Eski bir sürümle çalıştığını bilmeyen kişi yaşadığı sorunu o sürüme bağlayamaz, ikinci bir makinedeki eski kopya da kolayca unutulur; bu yüzden ailenin her üyesi kendisinin yeni bir sürümü çıkınca haber verir ve bildirim varsayılan olarak açıktır. UpdateCheck::new(aile, uygulama, paket, sürüm, yeni_sürümde) ile Command::check_for_update, cargo install'ın okuduğu crates.io seyrek dizinine paketin daha yeni bir sürümünün yayınlanıp yayınlanmadığını sorar. Kendi iş parçacığında sorar, ilk kare onu hiç beklemez; günde en fazla bir kez sorar: son sorunun zamanı uygulamanın durum klasöründe tutulur ve sormadan önce yazılır, böylece başarısız bir soru da başarılı olan gibi ertesi günü bekler; hatırlanamayan bir soru sorulmaz, çünkü her açılışta yeniden sorulurdu. Ağ yoksa, on saniyede cevap gelmezse ya da dizin okunamazsa sessiz kalır; geri çekilen sürümler ve ön sürümler sayılmaz, kayıttakinden yeni bir derleme hiçbir şey söylemez. Giden şey paketin adıdır: istekte kimlik, makine bilgisi ya da kullanım verisi yoktur, User-Agent'ı paket ve sürümüdür. Anahtar uygulamanın değil ailenindir: quvyta.conf'ta update-notice; soran bir uygulamada Görünüm bölümünün hemen ardından Appearance::updates ile gösterilir, sormayan onu eklemez; böylece hiçbir ayar sayfası orada bir şey yapmayan bir anahtar sunmaz (ve var olan ayar sayfalarının yerleşimi korunur); anahtar yokken açıktır, kapalıyken hiçbir şey sorulmaz ve yazılmaz. Update::toast() her üyenin aynı biçimde gösterdiği bildirimdir: yeni sürüm, çalışan sürüm ve nasıl güncelleneceği, ailenin başlatıcısından ya da cargo install ile. Ağ kodu updates özelliğinin arkasındadır, soru sormayan bir üye onu hiç taşımaz; yalnızca rustls ile ureq, qcode'un zaten derlediği istemci. Harness ağa da denetimin klasörlerine de hiç uzanmaz: soruyu kaydeder (update_checks) ve set_latest_version ile cevaplar; Handoff ve Command::open ile aynı kural, böylece bir uygulamanın kendi testleri yanlışlıkla crates.io'ya gidemez."

[[item]]
id       = "setup-wizard"
name     = "Setup wizard"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "setup-wizard"
types    = ["Setup", "SetupMsg", "SetupWizard"]
notes    = "The first-run wizard, built on the Wizard every other flow uses rather than a second layout: the framework draws and drives the appearance step, the application adds its own with step(title, page) as many times as it likes. It opens while the application has no settings file of its own, after any adopt migration; whether the family already shares anything only fills the first step, which is always shown, pre-filled and with every box ticked, so one Next accepts all of it. Nothing at all is written until it ends: Family::preferences_without_saving leaves a missing quvyta.conf missing and Appearance::without_saving applies a change without saving it, so a wizard closed half-way leaves the settings folder as it found it and comes again next start. \"Start with the defaults\", under the rows of the first step, sends the same Finish from anywhere and is the way out that keeps what is filled in. Finish writes the three shared keys through Family::set, each to the family's file or the application's own by its box, which makes the application's file and ends the wizard for good; a key kept here alone never reaches quvyta.conf, so another application detects it. Only then is the on_finish message sent, and the application writes its own keys there with the Settings the wizard kept in step. A write that fails leaves the wizard open, says why on the first step and tells the application nothing. The first step is Appearance::rows, which now means the three shared rows alone, each with its \"In every Quvyta application\" box; reduced motion and the pillar stay in Appearance::section, which a settings page uses. Choosing a theme redraws the wizard in that theme at once, because the change is applied while it waits to be saved. Under the rows the same four icons are drawn in all three glyph modes at once, whatever mode the application draws in, so the eye chooses; a row per mode rather than the note's single row, which 40 columns would cut. Without a Nerd Font the step offers the install, shows its progress and afterwards the samples again with after_install_text. Setup is generic over the application's message so it can hold on_finish and wrap, which is what lets it write and only then hand over; it is the state the application holds, SetupWizard the view built in view, as FileBrowser and FilePicker already are. One step method instead of the draft's app_step and extra_step: they would have been two names for one thing. Texts are in the framework's language files under quvyta.setup in all nine languages, with the step's own name and rows from quvyta.appearance. The demo works in a folder of its run and installs the font into it, so neither a test nor a showcase run touches ~/.config/quvyta or the user's fonts."
notes-tr = "İlk açılış sihirbazı, ikinci bir düzen yazılmadan başka her akışın kullandığı Wizard'ın üstünde: görünüm adımını framework çizer ve yönetir, uygulama kendi adımlarını step(başlık, sayfa) ile istediği kadar ekler. Uygulamanın kendi ayar dosyası yokken, taşımadan sonra da yokken açılır; ailenin bir şey paylaşıp paylaşmaması yalnızca ilk adımın dolu gelen değerlerini belirler. İlk adım her zaman gösterilir, dolu ve her kutusu işaretli; tek bir İleri hepsini kabul eder. Bitene kadar hiçbir şey yazılmaz: Family::preferences_without_saving olmayan quvyta.conf'u olmayan bırakır, Appearance::without_saving değişikliği kaydetmeden uygular; yarıda kapatılan sihirbaz ayar klasörünü bulduğu gibi bırakır ve bir sonraki açılışta yine gelir. İlk adımın satırlarının altındaki \"Varsayılanlarla başla\" aynı Bitir'i her yerden gönderir; doldurulanı koruyarak çıkma yolu budur. Bitir üç ortak anahtarı Family::set ile yazar, her birini kutusuna göre ailenin dosyasına ya da uygulamanın kendi dosyasına; bu, uygulamanın dosyasını oluşturur ve sihirbazı temelli bitirir. Burada tutulan bir anahtar quvyta.conf'a hiç gitmez, onu başka bir uygulama algılar. on_finish mesajı ancak o zaman gider ve uygulama kendi anahtarlarını orada, sihirbazın güncel tuttuğu Settings ile yazar. Başarısız bir yazma sihirbazı açık bırakır, ilk adımda sebebini söyler ve uygulamaya bir şey söylemez. İlk adım Appearance::rows'tur; artık yalnızca üç ortak satır demektir, her birinin \"Tüm Quvyta uygulamalarında\" kutusuyla. Hareketi azalt ve vurgu çubuğu, ayar sayfasının kullandığı Appearance::section'da kalır. Tema seçmek sihirbazı hemen o temayla yeniden çizer, çünkü değişiklik kaydedilmeyi beklerken uygulanır. Satırların altında aynı dört ikon, uygulamanın hangi kiple çizdiğine bakılmadan üç glif kipinde birden çizilir; seçimi göz yapar. Notun tek satırı yerine kip başına bir satır: tek satır 40 sütunda kesilirdi. Nerd Font yoksa adım kurulumu önerir, ilerlemesini gösterir ve sonrasında örnekleri after_install_text ile yeniden gösterir. Setup uygulamanın mesajı üzerinden geneldir; on_finish'i ve wrap'i tutmasını, böylece önce yazıp sonra devretmesini bu sağlar. Setup uygulamanın tuttuğu durum, SetupWizard view içinde kurulan görünüm; FileBrowser ile FilePicker de böyle. Taslaktaki app_step ve extra_step yerine tek bir step: ikisi tek şeyin iki adı olurdu. Metinler framework'ün dil dosyalarında quvyta.setup altında, dokuz dilde; adımın adı ve satırları quvyta.appearance'tan. Deneme kendi çalışmasına ait bir klasörde çalışır ve yazı tipini oraya kurar; ne test ne showcase ~/.config/quvyta'ya ya da kullanıcının yazı tiplerine dokunur."

[[item]]
id       = "input-idleness"
name     = "Input idleness"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "date-time"
types    = ["idle_for", "on_idle"]
notes    = "How long no input has reached this terminal, for an application that never sees keys itself. Keys (press, repeat, release), every mouse event including the pointer moving over the window, pastes and the end of a handoff count; a resize, messages and background work do not. Before any input the silence counts from the start. ui.idle_for() reads it and keeps a view that shows it current by drawing again on each whole second, only while it is read. ui.on_idle(after, message) wakes the application exactly when the silence reaches after, with message(true), and again with message(false) at the first input, before the input reaches a widget. System-wide idleness is out of reach on purpose."
notes-tr = "Tuşları hiç görmeyen bir uygulama için bu terminale ne kadar süredir girdi gelmediği. Tuşlar (basma, tekrar, bırakma), imlecin pencere üzerinde gezinmesi dahil her fare olayı, yapıştırma ve bir devrin sonu sayılır; yeniden boyutlandırma, mesajlar ve arka plan işleri sayılmaz. Hiç girdi gelmeden önce sessizlik başlangıçtan sayılır. ui.idle_for() onu okur ve onu gösteren görünümü, yalnızca okunduğu sürece, her tam saniyede yeniden çizerek güncel tutar. ui.on_idle(after, message) uygulamayı sessizlik after'a ulaştığı anda message(true) ile, ilk girdide de, girdi bir bileşene ulaşmadan önce, message(false) ile uyandırır. Sistem genelindeki boşta kalma bilerek kapsam dışıdır."

[[item]]
id       = "page-transitions"
name     = "Page transitions"
group    = "foundations"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "page-transitions"
types    = ["PageTransition"]
notes    = "Pages cross-fade cell by cell, optionally with a short slide that follows the navigation direction, built on motion; the duration is the theme's motion.page, and reduced motion shows the new page at once. Layers (modal pop, toast slide-in, dropdown unfold) animate inside their own widgets."
notes-tr = "Sayfalar hücre hücre çapraz geçişle değişir, istenirse gezinme yönünü izleyen kısa bir kaymayla; motion üstüne kuruludur. Süre temanın motion.page değeridir, hareket azaltılınca yeni sayfa hemen görünür. Katmanlar (modal pop, bildirimin kayarak girişi, açılır listenin serilmesi) kendi bileşenlerinin içinde hareket eder."

[[item]]
id       = "text-selection"
name     = "Mouse text selection"
group    = "foundations"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "text-selection"
notes    = "Nothing is selectable unless a widget asks for it, and the selection region is that widget. Releasing the mouse copies nothing; ctrl c copies clean text and right click offers Copy and Raw copy."
notes-tr = "Bir bileşen istemedikçe hiçbir yer seçilemez ve seçim bölgesi o bileşendir. Fareyi bırakmak bir şey kopyalamaz; ctrl c temiz metni kopyalar, sağ tık Kopyala ve Ham kopyala seçeneklerini sunar."

