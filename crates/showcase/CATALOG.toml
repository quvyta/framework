# Every component and system of the Quvyta framework.
#
# Nothing exists outside this list. `cargo test` fails when a public widget type is not covered by
# an item's `types`, or when a `done` item has no complete showcase page (demo, code, guide and
# reference in English and Turkish). `planned` items appear faint in the showcase menu.
#
# group:    foundations | controls | display | structure | overlays | forms | content | examples
# kind:     infrastructure | widget | example
# priority: p0 | p1 | p2 | p3
# status:   planned | done
# notes:    design notes shown on the item's planned page (`notes` English, `notes-tr` Turkish).

[[item]]
id       = "runtime"
name     = "Runtime"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "getting-started"
types    = ["App", "Command", "Runtime", "Env", "AssetDirs", "Diagnostic", "Location", "Severity"]
notes    = "The core of every application: the App trait, commands for side effects, the runtime that drives them and diagnostics that point to a file, line and column. Every kind of file can be given as text instead of a path — theme_source, icon_source, locale_source and keymap_source take an include_str! — so an installed binary starts with nothing beside it on disk. Text loads after the paths, so it wins, and a path named as well is then optional: when it cannot be read the text stands in for it and the reason becomes a diagnostic instead of stopping the program. A screen with its own messages is placed with ui.map(convert, build) and its commands returned with command.map(convert): one pattern for every application. Everything inside arrives converted, also layers, overlays and focus requests, and a message background work sends later goes through the same conversion, which is why a command's conversion must be Send and Sync. The lifecycle is four optional App methods with defaults. init runs once at the start of the first frame, after the first size and before the view is built, and returns a Command; a focus it asks for lands when that frame is painted, before any input is read, so the first key reaches it. resized hears the size of the frame being drawn (the size ui.size() reports) at start and on every change, as a message through update. before_quit is asked whenever the runtime quits for the user (the quit binding, the palette's quit action); a message keeps the application running, and Command::quit, the application's own decision, is never asked about. terminating hears that the system is ending the application, as a Termination: on Unix the runtime catches SIGTERM and an outside SIGINT (Terminate: the terminal is still there, the default answers with before_quit) and SIGHUP (Hangup: the terminal went away, nothing is drawn or written after it, the default quits). None quits at once; a message keeps the application running to save and quit. Every way out is bounded: after the grace (five seconds for a terminate, three for a hangup) the runtime quits without the application, a second SIGTERM or SIGINT quits at once, a repeated hangup is the same hangup, and when the loop itself is stuck a watcher thread restores the terminal and ends the process by the signal a second later. The loop waits on the keyboard and on a socket the signal thread writes to, so it hears a signal at once. During a handoff the signal is passed on to the program's process group, which owns the terminal, and the application hears it once it has the terminal back. The harness runs all four where the terminal does; Harness::terminate simulates each signal."
notes-tr = "Her uygulamanın çekirdeği: App trait'i, yan etkiler için komutlar, bunları yürüten çalışma zamanı ve dosya, satır ve sütun gösteren tanılamalar. Her dosya türü yol yerine metin olarak da verilebilir — theme_source, icon_source, locale_source ve keymap_source bir include_str! alır — böylece kurulan ikili yanında hiç dosya olmadan açılır. Metin yollardan sonra yüklenir, yani kazanır; ayrıca verilen yol artık zorunlu değildir: okunamadığında metin onun yerine geçer ve sebep, programı durdurmak yerine bir tanılamaya dönüşür. Kendi mesajları olan bir ekran ui.map(dönüşüm, kurucu) ile yerleştirilir, komutları komut.map(dönüşüm) ile döndürülür: her uygulama için tek kalıp. İçindeki her şey dönüştürülmüş gelir, katmanlar, açılır parçalar ve odak istekleri de; arka plan işinin sonradan gönderdiği mesaj da aynı dönüşümden geçer, bu yüzden komutun dönüşümü Send ve Sync olmalıdır. Yaşam döngüsü, varsayılanı olan dört isteğe bağlı App metodudur. init ilk karenin başında, ilk ölçüden sonra ve görünüm kurulmadan önce bir kez çalışır ve bir Command döndürür; istediği odak o kare çizilince, hiçbir girdi okunmadan yerine oturur, böylece ilk tuş ona ulaşır. resized çizilen karenin ölçüsünü (ui.size()'ın bildirdiği ölçü) açılışta ve her değişimde update'ten geçen bir mesaj olarak duyar. before_quit, çalışma motoru kullanıcı adına her çıkacağında sorulur (çıkış bağı, paletin çıkış eylemi); bir mesaj uygulamayı açık tutar, uygulamanın kendi kararı olan Command::quit ise hiç sorulmaz. terminating, uygulamayı sistemin kapattığını bir Termination olarak duyar: Unix'te çalışma motoru SIGTERM ile dışarıdan gelen SIGINT'i (Terminate: terminal hâlâ yerinde, varsayılan before_quit ile cevap verir) ve SIGHUP'ı (Hangup: terminal gitti, bundan sonra hiçbir şey çizilmez ya da yazılmaz, varsayılan çıkar) yakalar. None hemen çıkar; bir mesaj uygulamayı kaydedip çıkması için açık tutar. Her çıkış sınırlıdır: süre dolunca (terminate için beş, kopuş için üç saniye) motor uygulamayı beklemeden çıkar, ikinci bir SIGTERM ya da SIGINT hemen çıkarır, tekrarlanan kopuş aynı kopuştur, döngünün kendisi takılırsa bir gözcü iş parçacığı bir saniye sonra terminali eski haline getirip süreci sinyalin kendisiyle bitirir. Döngü klavyeyi ve sinyal iş parçacığının yazdığı bir soketi birlikte bekler, bu yüzden sinyali hemen duyar. Devir sırasında sinyal terminalin sahibi olan programın süreç grubuna iletilir; uygulama onu terminali geri alınca duyar. Test düzeneği dördünü de terminalin çalıştırdığı yerde çalıştırır; Harness::terminate her sinyali taklit eder."

