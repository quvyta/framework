notes    = "The theme chooses the scrollbar style, and a scrollbar shows only when content overflows, never as a frame. Block is the default and is drawn with colours only; the others are half, thin and dots. Any other word in a theme, such as cell, is reported as a diagnostic."
notes-tr = "Kaydırma çubuğu stilini tema seçer; çubuk yalnızca içerik taştığında görünür ve çerçeve çizmez. Varsayılan block yalnızca renkle çizilir; diğerleri half, thin ve dots'tur. Temada bunların dışındaki bir sözcük, örneğin cell, tanılama olarak bildirilir."

[[item]]
id       = "tab-rail"
name     = "Tab rail"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "tab-rail"
types    = ["TabRail", "RailTab", "CollapsedMarker"]
notes    = "Vertical tabs with icon and name, status badges and a raised selected tab; closing, reordering, the context menu and edge scrolling while dragging are shared with Tabs. Collapsed, the rail is a four-cell strip (pillar, marker, a cell of air, scrollbar) that never slides; collapsed_marker and RailTab::marker show an icon, an initial or a number, and a tab's name card opens it on a click. row_height(n) makes each tab a raised block n lines tall, with content on the middle line and the close mark flush right on the first; blocks are one empty line apart unless gap(n) says otherwise. An optional add tab sits at the end."
notes-tr = "İkon ve isimli, durum rozetli, seçili sekmesi yükselen dikey sekmeler; kapatma, sıralama, sağ tık menüsü ve sürüklerken kenar kaydırma Tabs ile ortaktır. Daraltılınca ray hiç kaymayan dört hücrelik bir şerit olur (çubuk, işaret, bir hücre boşluk, kaydırma çubuğu); collapsed_marker ve RailTab::marker ikon, baş harf ya da numara gösterir, sekmenin ad kartı tıklanınca sekmeyi açar. row_height(n) her sekmeyi n satırlık yükseltilmiş bir blok yapar; içerik orta satırda, kapatma işareti ilk satırda sağa yaslıdır ve gap(n) başka bir şey söylemedikçe bloklar arasında bir boş satır kalır. Sonda isteğe bağlı bir ekle sekmesi bulunur."

[[item]]
id       = "widget-dock"
