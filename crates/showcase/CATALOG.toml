[[item]]
id       = "markdown"
name     = "Markdown"
group    = "content"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "markdown"
types    = ["Markdown"]
notes    = "Markdown is selectable by default; clean copies leave out pillars, code padding and line numbers. Punctuation after inline code never wraps onto a line alone, even when a code span wider than the line breaks, and three-digit list numbers show in full."
notes-tr = "Markdown varsayılan olarak seçilebilir; temiz kopya çubukları, kod iç boşluğunu ve satır numaralarını dışarıda bırakır. Satır içi koddan sonraki noktalama, satırdan geniş bir kod parçası bölünse bile tek başına alt satıra düşmez; üç haneli liste numaraları tam görünür."

