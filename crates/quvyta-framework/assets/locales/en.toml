[quvyta.duration]
# The units a duration field shows after its numbers.
hours   = "h"
minutes = "min"
seconds = "s"
# Every word read as a unit, comma separated. The words of every language are read whatever
# language is active, so they must not clash across languages.
hour-words   = "h, hr, hrs, hour, hours"
minute-words = "m, min, mins, minute, minutes"
second-words = "s, sec, secs, second, seconds"
hour-name    = "hours"
minute-name  = "minutes"
second-name  = "seconds"
empty     = "Nothing to read; write a length such as 1 h 30 min, 90 min or 2:15"
character = "“{text}” cannot be part of a length of time"
unit      = "“{text}” is not a unit of time; use h, min or s"
number    = "“{text}” is not a number"
no-number = "“{text}” needs a number before it"
no-unit   = "“{text}” needs a unit after it, such as min"
repeated  = "The {text} are written twice"
clock     = "“{text}” is not hours and minutes; write 2:15 or 2:15:30, with minutes and seconds under 60"
too-large = "Longer than the longest length, {text}"

# Installing the Nerd Font symbols (icons::nerd_font). {detail} is a program's own message
# or name, {path} what to delete to undo the install.
[quvyta.nerd-font]
task              = "Installing Symbols Nerd Font Mono"
downloading       = "Downloading the font"
downloading-share = "Downloading the font, {percent}%"
verifying         = "Checking the download"
installing        = "Installing the font"
done              = "Symbols Nerd Font Mono is installed. To remove it, delete {path}"
cancelled         = "The install was cancelled"
error-folder      = "This system names no font folder for your user"
error-tool        = "{detail} is needed for the install but is not on this system"
error-download    = "The download failed: {detail}"
error-verify      = "The download could not be checked: {detail}"
error-checksum    = "The download does not match its checksum, so it was deleted"
error-extract     = "The font could not be unpacked: {detail}"
error-copy        = "The font could not be copied into its folder: {detail}"
error-register    = "The font is in its folder, but the system could not be told about it: {detail}"
after-install     = "Look at the sample icons. If they show as shapes, your terminal draws with the new font; a terminal that was open before the install may need to be opened again first. If they still show as boxes or question marks, your terminal does not take missing symbols from other fonts. Then install JetBrainsMono Nerd Font and choose it as the font in your terminal's settings."
found             = "A Nerd Font is installed on this machine"
missing           = "No Nerd Font was found on this machine"
