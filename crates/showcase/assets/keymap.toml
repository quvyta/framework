# Showcase key bindings, layered over the framework's built-in keymap.

[global]
# `?` types into text fields and the terminal, so help also has a key that never types.
help      = ["?", "f1"]

[app]
search    = "/"
back      = "esc"
menu      = "ctrl+b"
demo      = "1"
code      = "2"
guide     = "3"
reference = "4"
# Focus the next window of the Windows demo, the way a desktop cycles windows.
window-cycle = "ctrl+alt+w"
# Out of the terminal page's shell and back in; the shell never sees it, see the page.
terminal-focus = "ctrl+alt+space"
