[quvyta.date]
# 1 is Monday, 7 is Sunday. English calendars in the US start on Sunday.
first-weekday = "7"
format = "{month} {day}, {year}"
# The same date with the short month name, for fields too narrow for the long one.
format-short = "{month} {day}, {year}"
# Without the year, for fields too narrow even for the short date.
format-day-month = "{month} {day}"
title = "{month} {year}"
month-1 = "January"
month-2 = "February"
month-3 = "March"
month-4 = "April"
month-5 = "May"
month-6 = "June"
month-7 = "July"
month-8 = "August"
month-9 = "September"
month-10 = "October"
month-11 = "November"
month-12 = "December"
weekday-1 = "Mo"
weekday-2 = "Tu"
weekday-3 = "We"
weekday-4 = "Th"
weekday-5 = "Fr"
weekday-6 = "Sa"
weekday-7 = "Su"
# Whole weekday names, for an axis with room for them; the two-letter names above are its
# fallback when it does not.
weekday-long-1 = "Monday"
weekday-long-2 = "Tuesday"
weekday-long-3 = "Wednesday"
weekday-long-4 = "Thursday"
weekday-long-5 = "Friday"
weekday-long-6 = "Saturday"
weekday-long-7 = "Sunday"
month-short-1 = "Jan"
month-short-2 = "Feb"
month-short-3 = "Mar"
month-short-4 = "Apr"
month-short-5 = "May"
month-short-6 = "Jun"
month-short-7 = "Jul"
month-short-8 = "Aug"
month-short-9 = "Sep"
month-short-10 = "Oct"
month-short-11 = "Nov"
month-short-12 = "Dec"
# A language whose month names change inside a date may add `month-in-date-1` to
# `month-in-date-12`, the form `format` shows: Russian `января` where the heading says `Январь`.
# Without them `format` shows the month names above.

[quvyta.time]
# `hour` and `minute` arrive as two digits on a 24-hour clock.
clock = "{hour}:{minute}"
hour = "{hour}"
span = "{from}–{to}"
hours-minutes = "{hours} h {minutes} min"
hours = "{hours} h"
minutes = "{minutes} min"
seconds = "{seconds} s"

