[[item]]
id       = "handoff"
name     = "Handoff"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "handoff"
types    = ["Handoff", "HandoffOutcome", "HandoffRequest", "DetachedHandoff", "DetachedOutcome", "LiveChild", "ChildLine", "TestChild", "Open", "OpenOutcome", "OpenRequest"]
notes    = "A handoff blocks drawing on purpose: the user is talking to another program. The program runs in a process group of its own that is made the terminal's foreground while it runs, so Ctrl-C at a sudo prompt reaches the program and never ends the application, whose signal dispositions are never touched; taking the terminal back blocks SIGTTOU on the drawing thread for one call, through nix, the only safe way to block a signal. A process group is not a session: the program keeps the controlling terminal and the session, so a warm sudo ticket is still shared. Ctrl-Z does not suspend; a stopped program is continued. The screen is taken back and drawn again in full however the program ended. A detached handoff (Command::handoff_detached with a DetachedHandoff) is for a program that asks once and then serves the application, such as a helper started through pkexec: it runs like a handoff with standard input and output piped to the application and standard error on the terminal, and at the program's first line the foreground and the screen come back while the program runs on in the background as a LiveChild. Its own outcome type keeps HandoffOutcome unchanged for applications that match it. Later lines arrive through on_line, then ChildLine::Ended; one thread reads the output from the start, so nothing after the first line is lost, and each line wakes the loop. The last dropped clone closes the child's input, at the latest when the run ends. LiveChild::for_tests gives the harness a stand-in child that a TestChild plays. Not every program needs the terminal at all: a link for the browser, a file for its viewer. Command::open(target) hands it to this desktop's opener (xdg-open, open on macOS, start on Windows) beside the application, and Command::open_with takes an Open, which can name a program of its own with arguments, a directory and environment, and can ask for a message with Open::answer. The screen is never released and nothing is drawn again, so opening a link does not make the screen blink. The program is started on a thread of its own with its streams on the null device and a process group of its own, and the child is waited for only after the message has gone, because an opener may live as long as the window it opened: OpenOutcome::Opened therefore says the opener was handed the target and no more, OpenOutcome::Failed(reason) that nothing was started at all. Harness::opens() records what was asked for and Harness::set_open_outcome answers it, so a test run never reaches the desktop it runs on; OpenRequest::target is what was asked to be opened, whichever opener the machine has."
notes-tr = "Teslim çizimi bilerek durdurur: kullanıcı başka bir programla konuşuyordur. Program kendi süreç grubunda çalışır ve bu grup çalıştığı sürece terminalin ön planı yapılır; sudo isteminde Ctrl-C programa ulaşır, uygulamayı asla kapatmaz ve uygulamanın sinyal ayarlarına hiç dokunulmaz. Terminal geri alınırken çizim iş parçacığında tek bir çağrı için SIGTTOU engellenir; sinyal engellemenin tek güvenli yolu olan nix ile. Süreç grubu oturum değildir: program kontrol eden terminali ve oturumu korur, sıcak bir sudo bileti paylaşılmaya devam eder. Ctrl-Z askıya almaz; duran program devam ettirilir. Program nasıl biterse bitsin ekran geri alınır ve baştan çizilir. Arka planda süren teslim (DetachedHandoff ile Command::handoff_detached), bir kez sorup sonra uygulamaya hizmet eden programlar içindir, örneğin pkexec ile başlatılan bir yardımcı: standart girdi ve çıktısı uygulamaya boru, standart hatası terminal olarak teslim gibi çalışır; programın ilk satırında ön plan ve ekran geri gelir, program LiveChild olarak arka planda çalışmayı sürdürür. Kendi sonuç türü vardır, böylece HandoffOutcome'u eşleyen uygulamalar değişmez. Sonraki satırlar on_line ile, ardından ChildLine::Ended gelir; çıktıyı baştan tek bir iş parçacığı okur, ilk satırdan sonra hiçbir şey kaybolmaz ve her satır döngüyü uyandırır. Bırakılan son kopya çocuğun girdisini kapatır, en geç çalışma bittiğinde. LiveChild::for_tests test düzeneğine, bir TestChild'ın oynadığı yerine geçen bir çocuk verir. Her program terminale hiç ihtiyaç duymaz: tarayıcıya bir bağlantı, görüntüleyiciye bir dosya. Command::open(hedef) onu bu masaüstünün açıcısına (xdg-open, macOS'te open, Windows'ta start) uygulamanın yanında verir; Command::open_with ise bir Open alır ve o, kendi programını argümanlarıyla, klasörüyle ve ortam değişkenleriyle adlandırabilir, Open::answer ile bir mesaj isteyebilir. Ekran hiç bırakılmaz ve hiçbir şey yeniden çizilmez, bu yüzden bir bağlantı açmak ekranı karartmaz. Program kendi iş parçacığında, akışları boş aygıta bağlı ve kendi süreç grubunda başlatılır; çocuk ancak mesaj gittikten sonra beklenir, çünkü bir açıcı açtığı pencere kadar yaşayabilir. Bu yüzden OpenOutcome::Opened yalnızca hedefin açıcıya verildiğini söyler, OpenOutcome::Failed(sebep) ise hiçbir şeyin başlatılamadığını. Harness::opens() ne istendiğini kaydeder, Harness::set_open_outcome onu cevaplar; böylece bir test koşumu üzerinde çalıştığı masaüstüne hiç ulaşmaz. OpenRequest::target, makinenin açıcısı ne olursa olsun, açılması istenen şeydir."

[[item]]
id       = "nerd-font"
name     = "Nerd Font"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "nerd-font"
types    = ["nerd_font", "Install", "Archive", "Progress", "InstallError", "GlyphSample", "installed", "installed_in", "target_dir", "install", "after_install_text", "status_text", "RELEASE", "FAMILY", "FONT_FILE"]
notes    = "Only Symbols Nerd Font Mono is installed, the symbols without letters, from the NerdFontsSymbolsOnly archive of Nerd Fonts v3.5.1: the user keeps the font their terminal draws text with, and a terminal that takes missing glyphs from other installed fonts (fontconfig on Linux) finds the icons there. The archive's SHA-256 is written in the source and a download that does not match is deleted. The system's own programs do the work, so the framework gains no network, archive or hash crate: curl downloads, sha256sum or shasum -a 256 (certutil on Windows) checks, tar unpacks; Windows gets the zip archive because its tar is not sure to open xz, and its programs are taken from System32 so Git's GNU tar never stands in. The font goes into the user's own folder, no administrator needed: ~/.local/share/fonts/QuvytaNerdFont (following XDG_DATA_HOME) with fc-cache -f on Linux, ~/Library/Fonts on macOS, %LOCALAPPDATA%\\Microsoft\\Windows\\Fonts with a reg add under HKCU on Windows; undoing it is deleting the one path Progress::Done names. A font on disk does not prove the terminal draws with it, so GlyphSample draws the same icons in the Nerd and the Unicode column for the user's eye, and after_install_text says honestly what to do when the Nerd row still shows boxes: install JetBrainsMono Nerd Font and choose it in the terminal's settings. The task translates its label and notes when it is built, in update, because its own thread has no language. Only Linux is tested end to end; the macOS and Windows folders, archive and commands are unit-tested here and wait for a run on those systems."
notes-tr = "Yalnızca Symbols Nerd Font Mono kurulur, harfleri olmayan simgeler, Nerd Fonts v3.5.1'in NerdFontsSymbolsOnly arşivinden: kullanıcı terminalinin yazıyı çizdiği yazı tipini korur, eksik glifleri başka kurulu yazı tiplerinden alan bir terminal (Linux'ta fontconfig) simgeleri orada bulur. Arşivin SHA-256 özeti kaynakta yazılıdır; tutmayan indirme silinir. İşi sistemin kendi programları yapar, bu yüzden framework'e ağ, arşiv ya da özet kütüphanesi eklenmez: curl indirir, sha256sum ya da shasum -a 256 (Windows'ta certutil) denetler, tar açar; Windows'un tar'ı xz'yi açacağı kesin olmadığı için ona zip arşivi gider ve programları System32'den alınır, böylece Git'in GNU tar'ı araya girmez. Yazı tipi kullanıcının kendi klasörüne gider, yönetici izni gerekmez: Linux'ta ~/.local/share/fonts/QuvytaNerdFont (XDG_DATA_HOME'u izler) ve fc-cache -f, macOS'ta ~/Library/Fonts, Windows'ta %LOCALAPPDATA%\\Microsoft\\Windows\\Fonts ve HKCU altında reg add; geri almak Progress::Done'ın gösterdiği tek yolu silmektir. Yazı tipinin diskte olması terminalin onunla çizdiğini kanıtlamaz; bu yüzden GlyphSample aynı simgeleri Nerd ve Unicode sütunuyla kullanıcının gözüne çizer, after_install_text de Nerd satırı hâlâ kutucuk gösteriyorsa ne yapılacağını dürüstçe söyler: JetBrainsMono Nerd Font'u kurup terminalin ayarlarında seçmek. Görev etiketini ve notlarını kurulurken, update içinde çevirir, çünkü kendi iş parçacığının dili yoktur. Uçtan uca yalnızca Linux sınandı; macOS ve Windows klasörleri, arşivi ve komutları burada birim testleriyle sınanır ve o sistemlerde bir çalıştırmayı bekler."

[[item]]
id       = "subprocess"
name     = "Child process"
group    = "foundations"
kind     = "infrastructure"
priority = "p2"
status   = "done"
page     = "async-tasks"
types    = ["Process", "Line", "ProcessOutcome"]
notes    = "Runs a child inside a task and hands its output to the application line by line. With pipes standard output and standard error stay apart, so a failure stays recognisable; with pty(cols, rows) the child gets a pseudo-terminal of the size we choose, so programs that check for a terminal keep their progress and colour, and every line then arrives as Out. A carriage return overwrites the line being built instead of starting a new one; run_with_overwritten hands each overwritten frame, a progress bar's step, to a second callback as a Line tagged with its stream, while run drops them and Line keeps its two variants so exhaustive matches in applications still compile. The last line is delivered without a trailing newline, and bytes that are not UTF-8 become the replacement character. Standard input stays the application's own and the child is not put in its own session, which is what keeps a warm sudo ticket shared. no_stdin() gives the child an empty input instead, so a question it asks cannot take the application's keys, and on Unix starts it in a process group of its own, so cancelling kills the whole group and the programs it started go too. Only then: a child that reads the terminal from a group of its own would be stopped by the system, so with inherited input only the child itself is killed."
notes-tr = "Bir alt süreci bir iş içinde çalıştırır ve çıktısını uygulamaya satır satır verir. Boruyla standart çıktı ve standart hata ayrı kalır, böylece hata hata olarak tanınır; pty(sütun, satır) ile çocuk bizim verdiğimiz boyutta bir sözde terminal alır, terminal denetimi yapan programlar ilerlemesini ve rengini korur ve her satır Out olarak gelir. Satır başı, yeni satır açmak yerine yazılmakta olan satırı ezer; run_with_overwritten ezilen her kareyi, bir ilerleme çubuğunun adımını, akışının etiketini taşıyan bir Line olarak ikinci bir geri çağrıya verir, run ise onları atar; Line iki türüyle kalır, böylece uygulamalardaki eksiksiz eşleşmeler derlenmeye devam eder. Son satır sonunda yeni satır olmasa da teslim edilir; UTF-8 olmayan baytlar değiştirme karakterine döner. Standart girdi uygulamanın kendi girdisi kalır ve çocuk kendi oturumuna konmaz; sıcak sudo biletinin paylaşılmasını sağlayan budur. no_stdin() çocuğa bunun yerine boş bir girdi verir; sorduğu bir soru uygulamanın tuşlarını alamaz. Unix'te onu kendi süreç grubunda da başlatır; iptal bütün grubu öldürür, başlattığı programlar da gider. Yalnızca o zaman: terminali kendi grubundan okuyan bir çocuğu sistem durdurur, bu yüzden devralınan girdiyle yalnızca çocuğun kendisi öldürülür."

[[item]]
id       = "document"
name     = "Data file"
group    = "foundations"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "document"
types    = ["Document", "Shape", "ValueKind", "Table"]
notes    = "An application's own data file, where Settings stops: a declared shape, arrays of tables ([[profile]]) and nested tables, and no self-healing at all. A key nobody declared, a value of another type and a required key that is missing are each a located diagnostic; Table::location gives a key's place and Table::value_location its value's, the column the framework's own findings use, so an application's own checks land on the same column, and the readable part of a broken document is still given, because a file edited by hand is usually wrong in one place. Reading writes nothing: no repair, no default written into the file, no .bak, and the type has no way to write. Saving stays the application's own step with atomic_write, since only the application knows the order, grouping and comments its file should have."
notes-tr = "Settings'in bittiği yerde uygulamanın kendi veri dosyası: tanımlı bir şekil, tablo dizileri ([[profile]]) ve iç içe tablolar, kendini onarma ise hiç yok. Kimsenin tanımlamadığı bir anahtar, başka türden bir değer ve eksik bir zorunlu anahtar yeri belirtilen birer tanı olur; Table::location anahtarın, Table::value_location değerin yerini verir, framework'ün kendi bulgularının kullandığı sütunu, böylece uygulamanın kendi denetimleri de aynı sütuna düşer; bozuk bir belgenin okunabilen kısmı yine verilir, çünkü elle düzenlenen dosya genelde tek yerinden bozuktur. Okumak hiçbir şey yazmaz: onarım yok, dosyaya yazılan varsayılan yok, .bak yok ve tipin yazma yolu hiç yok. Kaydetmek atomic_write ile uygulamanın kendi adımı kalır, çünkü dosyanın sırasını, gruplamasını ve yorumlarını yalnızca uygulama bilir."

