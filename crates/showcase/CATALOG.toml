[[item]]
id       = "icon-system"
name     = "Icon system"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "theme-icons-language"
types    = ["Icons", "IconSetRegistry", "IconGlyphs", "Glyph", "IconMode", "GlyphMode", "PillarStyle", "PILLAR", "detect_glyph_mode", "default_font_dirs"]
notes    = "Every icon has a Nerd Font, a Unicode and an ASCII glyph, and an icon set can be given as text instead of a file. The set also answers the meanings an application's main menu shows — project, profile, settings and power — so every application in the family draws the same shapes; the Unicode column of those four stays inside Geometric Shapes, which terminals draw as one cell, so no row falls back to another font and overflows. An application's own sets add the keys the built-in set lacks to every set, so category.internet is drawn in any theme and follows the glyph mode; they sit under the chosen set and the theme's [icons], so a user can still restyle them, and a key the built-in set has (check) applies only while a theme names the set, because it restyles an icon every widget draws. A missing nerd or unicode column is a located warning and a plainer glyph stands in; a missing ascii column skips the icon. Beside the main menu the set answers other shared meanings, so the family draws one shape for each: window-minimize, window-maximize and window-restore on a window's title, six launcher categories (category-system, -development, -network, -office, -media, -files) that an entry without an icon of its own also takes, and family, Quvyta's ❖. Their Unicode column stays inside Geometric Shapes for the same reason as the menu's, because they sit in counted strips a fallback glyph would push apart; family is the one exception, since it is the mark itself and ◈ is already project. A test requires all ten to be one cell in every mode of every set, printable and undecorated in ASCII."
notes-tr = "Her ikonun bir Nerd Font, bir Unicode ve bir ASCII biçimi vardır; ikon seti dosya yerine metin olarak da verilebilir. Set, bir uygulamanın ana menüsünün gösterdiği anlamlara da karşılık verir — project, profile, settings, power — böylece ailedeki her uygulama aynı şekilleri çizer; bu dördünün Unicode biçimi, terminallerin tek hücre olarak çizdiği Geometric Shapes içinde kalır, böylece hiçbir satır başka bir yazı tipine düşüp taşmaz. Uygulamanın kendi setleri gömülü sette olmayan anahtarları her sete ekler; category.internet her temada çizilir ve glif kipine uyar. Bu anahtarlar seçili setin ve temanın [icons]'unun altında durur, kullanıcı onları yine de değiştirebilir; gömülü sette olan bir anahtar (check) yalnızca bir tema o seti seçtiğinde geçerlidir, çünkü her bileşenin çizdiği bir ikonu değiştirir. Eksik nerd ya da unicode sütunu yeri gösterilen bir uyarıdır ve daha sade glif yerine geçer; eksik ascii sütunu ikonu atlatır. Set, ana menünün yanında başka ortak anlamlara da karşılık verir; aile her biri için tek bir şekil çizer: pencere başlığındaki window-minimize, window-maximize, window-restore; ikonu olmayan girdinin de kullandığı altı başlatıcı kategorisi (category-system, -development, -network, -office, -media, -files); ve Quvyta'nın ❖ işareti olan family. Unicode biçimleri menününkiyle aynı sebepten Geometric Shapes içinde kalır: sayılı hücrelerden oluşan şeritlerde dururlar, yedek yazı tipine düşen bir glif o şeridi aralar. Tek istisna family'dir; o işaretin kendisidir ve ◈ zaten project'tir. Bir test, bu on adın her setin her kipinde tek hücre, ASCII'de yazdırılabilir ve süssüz olmasını şart koşar."

[[item]]
id       = "i18n-system"
name     = "Language system"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "theme-icons-language"
types    = ["I18n", "Arg", "PluralCategory", "t!", "scope", "translate_active", "decimal_separator", "number"]
notes    = "has(code, key) asks whether one named language carries a key in its own files, so a test can require every key an application uses in every language. It never looks at the active language and never follows fallbacks: a key Turkish borrows from English is missing for Turkish even though the screen shows the English text. A plural key counts as present. Comparing a translation with its key cannot do this job, because a missing key translates to ⟦key⟧. The framework speaks nine languages: en, tr, de, es, fr, pt-BR, ru, zh-Hans and ja, every file with every key. detect finds regional and script codes from the system: the whole tag (pt_BR → pt-BR), then the language with its script, which for Chinese follows the region (zh_CN → zh-Hans, zh_TW → zh-Hant), then the language (de_AT → de), then the only locale of that language (pt_PT → pt-BR). Plural forms follow the language of a regional code: pt-BR counts like pt, ru-RU like ru. The new translations still want a native speaker's reading. A language is more than its words. quvyta.number.decimal says what it writes between a number's whole part and its decimals — a point in English, Japanese and Chinese, a comma in German, Spanish, French, Portuguese, Russian and Turkish — and every number the framework draws goes through it: a chart's labels, a slider's value, a number field, a file's size. qframe::i18n::number(value, decimals) writes an application's own the same way, and a NumberInput takes that separator when it is typed, a point as well because a keypad has one, and rewrites itself when the language changes under it. Dates have four forms on Date itself — written(), written_short(), day_and_month() and day_and_month_short() — so an application never puts a day and a month together by hand and ends up with a heading saying September 18 beside a field saying 18 September. Units beside a number are written shorter than the word on its own: Chinese says 分 after a number where the word is 分钟, while the words read when a length is typed keep both."
notes-tr = "has(code, key) adı verilen tek bir dilin bir anahtarı kendi dosyalarında taşıyıp taşımadığını sorar; böylece bir test, uygulamanın kullandığı her anahtarı her dilde isteyebilir. Etkin dile hiç bakmaz ve yedek dillere düşmez: Türkçenin İngilizceden ödünç aldığı anahtar, ekranda İngilizce metin görünse de Türkçe için eksiktir. Çoğul anahtar var sayılır. Bir çeviriyi anahtarıyla karşılaştırmak bu işi göremez, çünkü eksik anahtar ⟦key⟧ olarak çevrilir. Framework dokuz dil konuşur: en, tr, de, es, fr, pt-BR, ru, zh-Hans ve ja, her dosyada her anahtar. detect sistemden bölge ve yazı kodlarını bulur: önce tam etiket (pt_BR → pt-BR), sonra yazısıyla dil, Çincede yazıyı bölge seçer (zh_CN → zh-Hans, zh_TW → zh-Hant), sonra dil (de_AT → de), en son o dilin tek dosyası (pt_PT → pt-BR). Çoğul biçimi bölgesel kodun diline göre seçilir: pt-BR pt gibi, ru-RU ru gibi sayar. Yeni çeviriler hâlâ bir ana dil konuşanının okumasını bekliyor. Bir dil sözcüklerinden ibaret değildir. quvyta.number.decimal, sayının tam kısmıyla ondalıkları arasına ne yazdığını söyler — İngilizce, Japonca ve Çincede nokta, Almanca, İspanyolca, Fransızca, Portekizce, Rusça ve Türkçede virgül — ve framework'ün çizdiği her sayı buradan geçer: grafik etiketleri, kaydırıcı değeri, sayı alanı, dosya boyutu. qframe::i18n::number(değer, basamak) uygulamanın kendi sayısını da aynı şekilde yazar; NumberInput o ayracı yazıldığında kabul eder, noktayı da kabul eder çünkü tuş takımında nokta vardır, ve altındaki dil değişince kendini yeniden yazar. Tarihin dört biçimi Date'in kendisindedir — written(), written_short(), day_and_month() ve day_and_month_short() — böylece uygulama günle ayı elle yan yana koyup başlığı Eylül 18, alanı 18 Eylül diyen bir ekran üretmez. Sayının yanındaki birimler sözcüğün tek başına hâlinden kısa yazılır: Çincede sayıdan sonra 分 gelir, sözcük ise 分钟'dır; bir süre yazıldığında okunan sözcükler ikisini de tutar."

[[item]]
id       = "view-layout"
name     = "View and layout"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "layout"
types    = ["View", "NodeMut", "Node", "LayoutProps", "Length", "Align", "Padding", "Rect", "Size", "Widget", "Container", "WidgetId", "MeasureCx", "PaintCx", "EventCx", "Event", "KeyEvent", "KeyKind", "MouseEvent", "MouseKind", "MouseButton"]
notes    = "An application chooses its own arrangement from ui.size(): the whole terminal, in columns and rows, the same in every nested builder because the view is built before layout divides the screen. Reading it is not I/O, a resize shows up in the next frame and Harness::resize does the same in tests. A widget adapting inside its own rectangle is a separate matter and stays inside the widget. A row with wrap(true) moves the children that do not fit to the next line, so a row of buttons that is too wide in one language or on a narrow terminal stays on screen: lines are filled in order by each child's measured width, a child wider than the row gets a line of its own, and gap, justify and spacers work per line; a spacer that has no room left on its line is dropped instead of pushing the next line. The row measures as tall as its lines, so what follows moves down; lines touch unless line_gap(rows) asks for space. A row that fits lays out exactly as without the option."
notes-tr = "Uygulama kendi dizilişini ui.size() ile seçer: sütun ve satır olarak terminalin tamamı; görünüm, yerleşim ekranı paylaştırmadan önce kurulduğu için her iç içe kurucuda aynıdır. Okumak G/Ç değildir, boyut değişikliği sonraki karede görünür, testlerde Harness::resize da aynısını yapar. Bir bileşenin kendi dikdörtgeni içindeki uyumu ayrı bir konudur ve bileşenin içinde kalır. wrap(true) verilen bir satır sığmayan çocuklarını alt satıra alır; böylece bir dilde ya da dar bir terminalde fazla geniş gelen düğme satırı ekranda kalır: satırlar her çocuğun ölçtüğü genişlikle sırayla doldurulur, satırdan geniş bir çocuk tek başına bir satır alır; gap, justify ve spacer her satırda ayrı çalışır; satırında yer kalmayan bir spacer sonraki satırı itmek yerine dışarıda bırakılır. Satır, satırlarının toplamı kadar ölçülür, ardından gelenler aşağı kayar; line_gap(satır) istenmedikçe satırlar birbirine değer. Sığan bir satır seçenek yokmuş gibi yerleşir."

