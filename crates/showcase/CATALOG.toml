[[item]]
id       = "table"
name     = "Table"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "table"
types    = ["Table", "Column", "ColumnWidth", "SortDirection", "TableCell", "TableRow"]
notes    = "The check mark stays put while the first cell slides. The arrows in the header scroll hidden columns into view when clicked. A cell's icon is an icon key or a literal Glyph, drawn as the glyph, one space and the text; without a colour it is muted and takes the row's text colour on the selected row, so it stays quieter than the name and never carries meaning by colour. A narrow column cuts only the text; the glyph and its space always stay, in every glyph mode. context_menu(|index| ..) gives every row a menu of its own: the menu acts on the row it was opened on, not on the selected one, and that row stays raised while it is open. A right press picks the row under the pointer and makes it the selection unless it is checked; the menu key opens the menu of the selected row, scrolling it into view first. A single menu wrapped around the table would act on whatever the cursor rests on, which in a file list means deleting the wrong file."
notes-tr = "İlk hücre kayarken seçim işareti yerinde kalır. Başlıktaki oklar tıklanınca gizli sütunları görünür hale kaydırır. Hücrenin ikonu bir ikon anahtarı ya da sabit bir Glyph olur; glif, bir boşluk ve metin olarak çizilir. Renk verilmezse muted çizilir ve seçili satırda satırın metin rengini alır; böylece addan sessiz kalır ve anlamı renkle taşımaz. Dar sütun yalnızca metni keser; glif ve boşluğu her glif kipinde hep kalır. context_menu(|index| ..) her satıra kendi menüsünü verir: menü, seçili satıra değil açıldığı satıra iş yapar ve o satır menü açık kaldığı sürece yükselmiş durur. Sağ basış farenin altındaki satırı alır ve satır işaretli değilse onu seçim yapar; menü tuşu seçili satırın menüsünü açar, önce onu görünür kılar. Tabloyu saran tek bir menü imlecin durduğu satıra iş yapardı; bir dosya listesinde bu, yanlış dosyayı silmek demektir."

[[item]]
id       = "tree"
name     = "Tree"
group    = "structure"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "tree"
types    = ["Tree", "TreeNode", "TreeMove", "TreeDrop"]
notes    = "Indentation and chevron stay put; only the icon and label slide. A loading node keeps its chevron for the first 300 ms and then spins for at least 500 ms, so quick loads never flash a spinner. Reorderable, a node is dragged among its siblings like a tab of the tab rail: the siblings make room, a ghost follows the pointer, the dragged node's children fold away and a drag held on the top or bottom row scrolls. ctrl shift up and down do the same from the keyboard, and the move is one TreeMove the application applies to its own list. A reorder keeps a node's parent; moving it elsewhere is a drop or an action of the context menu that a right click, shift f10 or the menu key opens. With multi_select, ctrl click, shift click, shift with the arrows and space select several nodes: they all take the selection tone while only the cursor's row keeps the pillar and slides, and esc reduces them to one. droppable drags the selection into a node that accepts it, such as a folder: the target takes the accent tone, the dragged nodes, their descendants and the folder they are already in stay faint and refuse, a closed folder opens after the drag rests on it for 400 ms, and the drop is one TreeDrop with the keys in tree order. With reorderable as well, a row that accepts drops takes the node in and any other row is a place among its siblings. A right click on a selected row gives the menu for the whole selection; outside it the row becomes the selection first."
notes-tr = "Girinti ve ok yerinde kalır; yalnızca ikon ve yazı kayar. Yüklenen düğüm ilk 300 ms okunu korur, sonra en az 500 ms döner; böylece hızlı yüklemelerde spinner bir anlığına belirip kaybolmaz. Sıralanabilir ağaçta bir düğüm, tab rail'deki sekme gibi kardeşleri arasında sürüklenir: kardeşler yer açar, bir hayalet imleci izler, sürüklenen düğümün çocukları katlanır ve üst ya da alt satırda tutulan sürükleme ağacı kaydırır. Klavyede ctrl shift yukarı ve aşağı aynısını yapar; taşıma, uygulamanın kendi listesine uyguladığı tek bir TreeMove'dur. Sıralama düğümün ebeveynini korur; başka yere taşımak bir bırakmadır ya da sağ tık, shift f10 veya menü tuşunun açtığı bağlam menüsündeki bir eylemdir. multi_select ile ctrl tık, shift tık, shift ile oklar ve boşluk birden çok düğüm seçer: hepsi seçim tonunu alır, ama çubuğu yalnızca imlecin satırı taşır ve yalnızca o kayar; esc seçimi teke indirir. droppable seçimi onu kabul eden bir düğüme, örneğin bir klasöre sürükletir: hedef vurgu rengini alır; sürüklenen düğümler, onların altındakiler ve zaten içinde oldukları klasör soluk kalır ve bırakmayı reddeder; kapalı bir klasör sürükleme üzerinde 400 ms bekleyince açılır; bırakma, anahtarları ağaçtaki sırasıyla taşıyan tek bir TreeDrop'tur. reorderable da açıksa bırakma kabul eden satır düğümü içine alır, diğer satırlar kardeşler arasında bir yerdir. Seçili bir satıra sağ tık bütün seçimin menüsünü açar; seçim dışındaki satır önce seçimin kendisi olur."

[[item]]
id       = "card-grid"
name     = "Card grid"
group    = "structure"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "card-grid"
types    = ["CardGrid"]
notes    = "Cards in as many columns as fit: at least the least card width, sharing the room up to the widest; an area narrower than one card shows one column as wide as the area and the content is cut with …. The arrows move in two dimensions and stop at the edges (Right on the last card of a row stays there, Down onto a shorter last row gives its last card); Home and End, PgUp and PgDn jump. Only the cards on screen are built, by the application's card closure, while the grid paints, so ten thousand cards cost one screen of them. One highlight: a moving pointer carries it and the selected card rests; a key takes it back and goes on from the card the pointer was on. A card is a surface, not a row: hover lifts it one tone with a soft pillar down its left edge, the selection takes the selected surface with a breathing pillar, and nothing slides. Checks are opt-in: a checked card carries the accent mark in its top right corner, a lit card offers a faint one, and Space or a click on the mark toggles it. Widgets inside a card are drawn but take no input; the card is the pressable surface. The empty grid shows the application's EmptyState. context_menu(|index| ..) gives every card a menu of its own, built for the card it was opened on, which stays raised while the menu is open; a right press makes that card the selection unless it is checked, and the menu key opens the menu of the card the keys are on."
notes-tr = "Kartlar sığdığı kadar sütunda: en az kart genişliğinde, kalan yeri en fazla genişliğe kadar paylaşarak; tek karttan dar bir alanda tek sütun alan kadar geniş olur ve içerik … ile kesilir. Oklar iki boyutta gezer ve kenarda durur (satırın son kartında sağ ok yerinde kalır, kısa son satıra inen aşağı ok son kartı verir); Home ve End, PgUp ve PgDn atlar. Yalnızca ekrandaki kartlar, uygulamanın kart kapatmasıyla, ızgara çizilirken kurulur; on bin kart bir ekranlık kart kadar tutar. Tek vurgu: hareket eden fare vurguyu taşır, seçili kart dinlenir; bir tuş vurguyu geri alır ve farenin üstünde durduğu karttan devam eder. Kart bir yüzeydir, satır değil: üstüne gelince bir ton yükselir ve sol kenarı boyunca soluk bir çubuk alır, seçim seçili zemini ve nefes alan çubuğu alır, hiçbir şey kaymaz. İşaretler isteğe bağlıdır: işaretli kart sağ üst köşesinde vurgu renginde işaret taşır, yanan kart soluk bir işaret gösterir, Boşluk ya da işarete tıklamak işareti değiştirir. Kartın içindeki bileşenler çizilir ama girdi almaz; basılan yüzey karttır. Boş ızgara uygulamanın verdiği EmptyState'i gösterir. context_menu(|index| ..) her karta kendi menüsünü verir; menü açıldığı kart için kurulur ve o kart menü açıkken yükselmiş durur. Sağ basış, kart işaretli değilse onu seçim yapar; menü tuşu tuşların üstünde olduğu kartın menüsünü açar."

[[item]]
id       = "splitter"
name     = "Splitter"
group    = "structure"
