types    = ["Popover", "Placement"]
notes    = "The press that dismisses a popover still reaches what it landed on, except that a press on the widget that opened it only closes it. Dialogs, by contrast, swallow presses outside them."
notes-tr = "Açılır kutuyu kapatan tıklama düştüğü yere de ulaşır; yalnızca kutuyu açan bileşene tıklamak onu sadece kapatır. Pencereler ise dışlarındaki tıklamaları yutar."

[[item]]
id       = "floating-surface"
name     = "Floating surfaces"
group    = "overlays"
kind     = "infrastructure"
priority = "p1"
status   = "done"
page     = "popover"
types    = ["PaintCx::floating"]
notes    = "Menus, popovers, lists, tooltips, toasts and dialogs all paint on the theme's overlay tone, which sits close to the panel tones, so a menu opened inside a panel melted into it. Now a floating surface looks at the cells around it before it paints. When its own tone comes out too close to a ground that covers at least a quarter of that ring (closer than 0.05 in OKLab, a barely visible step), all of its backgrounds move together by the smallest amount that clears every such ground, towards the theme's text colour (lighter on a dark theme, darker on a light one) or towards the canvas, whichever needs less, never more than 30%. No colour is written by hand, so it holds in every theme, monochrome included, and in themes nobody has written yet. Over the screen ground every built-in theme's overlay is already far enough, so nothing moves there; text colours stay, and a highlighted row moves with the menu so it stays as distinct as before. In 256 and 16 colours the screen holds only palette entries and nothing moves. Custom widgets get the same with PaintCx::floating(rect, paint) from paint_overlay."
notes-tr = "Menüler, açılır kutular, listeler, ipuçları, bildirimler ve pencereler hep temanın katman tonuna çizilir; bu ton panel tonlarına yakın durduğu için panelin içinde açılan bir menü panele karışıyordu. Artık yüzen bir yüzey çizilmeden önce çevresindeki hücrelere bakar. Kendi tonu, o halkanın en az dörtte birini kaplayan bir zemine fazla yakın çıkarsa (OKLab'de 0.05'ten yakın, zor seçilen bir adım), bütün zeminleri birlikte, her zemini aşacak en küçük miktarda kayar: temanın yazı rengine (koyu temada açığa, açık temada koyuya) ya da tuval rengine doğru, hangisi daha az gerektiriyorsa, en fazla %30. Hiçbir renk elle yazılmaz; bu yüzden monokrom dahil her temada, henüz yazılmamış temalarda bile tutar. Ekran zemini üzerinde her hazır temanın katman tonu zaten yeterince uzak, orada hiçbir şey kaymaz; yazı renkleri kalır, vurgulu satır menüyle birlikte kayar ve eskisi kadar ayrı kalır. 256 ve 16 renkte ekran yalnızca palet girdileri tuttuğu için hiçbir şey kaymaz. Kendi bileşenlerin paint_overlay içinden PaintCx::floating(alan, çizim) ile aynısını alır."

[[item]]
