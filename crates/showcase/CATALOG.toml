[[item]]
id       = "theme-system"
name     = "Theme system"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "theme-icons-language"
types    = ["Theme", "ThemeRegistry", "Resolved", "Selector", "State", "Paint", "Motion", "StyleProps", "PropValue", "WORD_PROPS", "REQUIRED_COLORS", "WidgetStyle", "CellStyle", "Rgb", "ColorDepth"]
notes    = "Stacked switches may read as one block; that is intended. In Amber the track of a switch that is off sits one tone higher so it stays readable."
notes-tr = "Üst üste duran anahtarların tek blok gibi görünmesi bilinçli bir tercihtir. Amber temasında kapalı anahtarın izi okunur kalsın diye bir ton yukarıda durur."

[[item]]
id       = "icon-system"
name     = "Icon system"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "theme-icons-language"
types    = ["Icons", "IconSetRegistry", "IconGlyphs", "IconMode", "GlyphMode", "PillarStyle", "PILLAR", "detect_glyph_mode", "default_font_dirs"]
notes    = "Every icon has a Nerd Font, a Unicode and an ASCII glyph, and an icon set can be given as text instead of a file. The set also answers the meanings an application's main menu shows — project, profile, settings and power — so every application in the family draws the same shapes; the Unicode column of those four stays inside Geometric Shapes, which terminals draw as one cell, so no row falls back to another font and overflows."
notes-tr = "Her ikonun bir Nerd Font, bir Unicode ve bir ASCII biçimi vardır; ikon seti dosya yerine metin olarak da verilebilir. Set, bir uygulamanın ana menüsünün gösterdiği anlamlara da karşılık verir — project, profile, settings, power — böylece ailedeki her uygulama aynı şekilleri çizer; bu dördünün Unicode biçimi, terminallerin tek hücre olarak çizdiği Geometric Shapes içinde kalır, böylece hiçbir satır başka bir yazı tipine düşüp taşmaz."

[[item]]
id       = "i18n-system"
name     = "Language system"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "theme-icons-language"
types    = ["I18n", "Arg", "PluralCategory", "t!", "scope", "translate_active"]
notes    = "has(code, key) asks whether one named language carries a key in its own files, so a test can require every key an application uses in every language. It never looks at the active language and never follows fallbacks: a key Turkish borrows from English is missing for Turkish even though the screen shows the English text. A plural key counts as present. Comparing a translation with its key cannot do this job, because a missing key translates to ⟦key⟧."
notes-tr = "has(code, key) adı verilen tek bir dilin bir anahtarı kendi dosyalarında taşıyıp taşımadığını sorar; böylece bir test, uygulamanın kullandığı her anahtarı her dilde isteyebilir. Etkin dile hiç bakmaz ve yedek dillere düşmez: Türkçenin İngilizceden ödünç aldığı anahtar, ekranda İngilizce metin görünse de Türkçe için eksiktir. Çoğul anahtar var sayılır. Bir çeviriyi anahtarıyla karşılaştırmak bu işi göremez, çünkü eksik anahtar ⟦key⟧ olarak çevrilir."

[[item]]
id       = "view-layout"
name     = "View and layout"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "layout"
types    = ["View", "NodeMut", "Node", "LayoutProps", "Length", "Align", "Padding", "Rect", "Size", "Widget", "Container", "WidgetId", "MeasureCx", "PaintCx", "EventCx", "Event", "KeyEvent", "KeyKind", "MouseEvent", "MouseKind", "MouseButton"]
notes    = "An application chooses its own arrangement from ui.size(): the whole terminal, in columns and rows, the same in every nested builder because the view is built before layout divides the screen. Reading it is not I/O, a resize shows up in the next frame and Harness::resize does the same in tests. A widget adapting inside its own rectangle is a separate matter and stays inside the widget."
notes-tr = "Uygulama kendi dizilişini ui.size() ile seçer: sütun ve satır olarak terminalin tamamı; görünüm, yerleşim ekranı paylaştırmadan önce kurulduğu için her iç içe kurucuda aynıdır. Okumak G/Ç değildir, boyut değişikliği sonraki karede görünür, testlerde Harness::resize da aynısını yapar. Bir bileşenin kendi dikdörtgeni içindeki uyumu ayrı bir konudur ve bileşenin içinde kalır."

