[[item]]
id       = "appearance-rows"
name     = "Appearance rows"
group    = "forms"
kind     = "widget"
priority = "p2"
status   = "done"
page     = "shared-preferences"
types    = ["Appearance", "AppearanceChange"]
notes    = "The appearance section every Quvyta application shows, built for a SettingsList so a settings page and the first step of the setup wizard place the same thing: section adds a heading, rows does not. Language, theme and icons (Detect, Nerd Font, Unicode, ASCII) each carry a nested row \"In every Quvyta application\" with a Checkbox, checked while the application follows the family; a change goes to Family::set with Scope::Family when checked and Scope::App when cleared, and clearing or checking the box alone moves the current value between the two files. Reduced motion and the pillar are the application's own keys and go to its own file, one key read and written at a time. The pillar is a framework setting the appearance rows of qpac and qfocus both showed, so it is part of the section. When QUVYTA_REDUCED_MOTION decides, the reduced motion row is disabled and says whether the shell reduced or kept motion. The application receives an AppearanceChange and hands it to Appearance::update with its in-memory Settings, which take the change too so a later save does not write back an old theme; update returns the command that shows the change at once. A change that cannot be saved is still applied and its row says why until the next change. The icon row has no sample glyphs yet: those belong to the setup wizard's step with the Nerd Font install. Texts are in the framework's language files under quvyta.appearance in all nine languages. SettingRow::nested came with it: the box rows start two cells further in so they read as part of the row above."
notes-tr = "Her Quvyta uygulamasının gösterdiği görünüm bölümü, bir SettingsList için kuruldu; ayar sayfası da kurulum sihirbazının ilk adımı da aynı şeyi yerleştirir: section bir başlık ekler, rows eklemez. Dil, tema ve ikonların (Algıla, Nerd Font, Unicode, ASCII) her birinin altında bir Checkbox'lı iç içe satır, \"Tüm Quvyta uygulamalarında\" durur; uygulama aileyi izlerken işaretlidir. İşaretliyken değişiklik Scope::Family ile, boşken Scope::App ile Family::set'e gider; yalnızca kutuyu değiştirmek o anki değeri iki dosya arasında taşır. Hareketi azalt ve vurgu çubuğu uygulamanın kendi anahtarlarıdır ve kendi dosyasına, her seferinde tek anahtar okunup yazılarak gider. Vurgu çubuğu, qpac ve qfocus'un görünüm satırlarının ikisinin de gösterdiği bir framework ayarıdır, bu yüzden bölümün parçası. QUVYTA_REDUCED_MOTION karar verirken hareketi azalt satırı pasiftir ve kabuğun hareketi azalttığını mı koruduğunu mu söyler. Uygulama bir AppearanceChange alır ve onu bellekteki Settings'iyle Appearance::update'e verir; ayarlar da değişikliği alır, böylece sonraki bir kaydetme eski temayı geri yazmaz. update değişikliği hemen gösteren komutu döndürür. Kaydedilemeyen değişiklik yine uygulanır ve satırı bir sonraki değişikliğe kadar nedenini söyler. İkon satırında henüz örnek simge yok: onlar Nerd Font kurulumuyla birlikte sihirbazın adımına ait. Metinler framework'ün dil dosyalarında quvyta.appearance altında, dokuz dilde. SettingRow::nested onunla geldi: kutu satırları iki hücre içeriden başlar, böylece üstteki satırın parçası gibi okunur."
