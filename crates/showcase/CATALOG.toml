notes    = "The press that dismisses a popover still reaches what it landed on, except that a press on the widget that opened it only closes it. Dialogs, by contrast, swallow presses outside them."
notes-tr = "Açılır kutuyu kapatan tıklama düştüğü yere de ulaşır; yalnızca kutuyu açan bileşene tıklamak onu sadece kapatır. Pencereler ise dışlarındaki tıklamaları yutar."

