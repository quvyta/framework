notes-tr = "Girinti ve ok yerinde kalır; yalnızca ikon ve yazı kayar. Yüklenen düğüm ilk 300 ms okunu korur, sonra en az 500 ms döner; böylece hızlı yüklemelerde spinner bir anlığına belirip kaybolmaz."

