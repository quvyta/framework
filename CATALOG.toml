notes-tr = "Yapıştırma önce sistem aracını, sonra OSC 52'yi, en son uygulama içindeki son kopyayı dener. Seçimler temiz ya da ham kopyalanır; fareyi bırakmak hiçbir zaman kopyalamaz."

