[[item]]
id       = "toast"
name     = "Toast"
group    = "overlays"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "toast"
types    = ["Toast", "ToastKind", "Corner"]
notes    = "Any one-cell spinner animation can play in the icon cell with icon_motion. Only the three-cell close mark shared with tabs dismisses a toast, and only the pointer on it lights it. A press on the body does nothing unless on_press gives it a message; then the toast stays and rises one step under the pointer. A toast never covers an open modal layer: the stack keeps to the rows between its corner and the dialog's surface, one free row apart, and a toast without room there waits, its time stopped, until the dialog closes or the screen grows. A toast's time runs only while it is on screen."
notes-tr = "icon_motion ile tek hücrelik herhangi bir spinner animasyonu ikon hücresinde oynar. Bildirimi yalnızca sekmelerle ortak üç hücrelik kapatma işareti kapatır ve işaret yalnızca imleç üzerindeyken aydınlanır. Gövdeye basmak, on_press bir mesaj vermedikçe hiçbir şey yapmaz; verirse bildirim yerinde kalır ve imlecin altında bir kademe yükselir. Bildirim açık bir modal katmanın üstüne binmez: yığın, köşesiyle diyaloğun yüzeyi arasındaki satırlarda, bir satır arayla kalır; orada yer bulamayan bildirim, diyalog kapanana ya da ekran büyüyene kadar süresi durmuş halde bekler. Bildirimin süresi yalnızca ekrandayken işler."

