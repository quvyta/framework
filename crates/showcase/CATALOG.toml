[[item]]
id       = "example-file-explorer"
name     = "File explorer"
group    = "examples"
kind     = "example"
priority = "p2"
status   = "done"
page     = "example-file-explorer"
notes    = "Going to a folder or previewing a file keeps the table and preview until the answer arrives. The folder being read shows a spinner on its tree row only when the read is slow (after 300 ms, for at least 500 ms)."
notes-tr = "Bir klasöre gitmek ya da dosya önizlemek, cevap gelene kadar tabloyu ve önizlemeyi korur. Okunan klasör, ağaçtaki satırında yalnızca okuma yavaşsa spinner gösterir (300 ms sonra, en az 500 ms)."

[[item]]
id       = "sparkline"
name     = "Sparkline"
group    = "display"
kind     = "widget"
priority = "p3"
status   = "done"
page     = "sparkline"
types    = ["Sparkline"]
notes    = "A point can be read off the trend: a press or a drag reads the column under the pointer, and while focused the arrow keys move one sample, Home and End jump to the oldest and the newest shown, and Esc stops reading. The read column stands on the active surface in the accent, a hovered one on a ground one hover step brighter; nothing slides, because a sparkline is not a row structure. The application owns which sample is being read and writes its value itself."
notes-tr = "Grafikten bir nokta okunabilir: basmak ya da sürüklemek imlecin altındaki sütunu okur; odakta ok tuşları bir örnek ilerler, Home ve End gösterilen en eski ve en yeni örneğe atlar, Esc okumayı bırakır. Okunan sütun vurgu renginde ve active zemininde durur, üzerine gelinen sütunun zemini bir hover adımı aydınlanır; hiçbir şey kaymaz, çünkü grafik bir satır yapısı değildir. Hangi örneğin okunduğunu uygulama tutar ve değerini kendisi yazar."

[[item]]
id       = "gauge"
name     = "Gauge"
group    = "display"
kind     = "widget"
priority = "p3"
status   = "done"
page     = "gauge"
types    = ["Gauge"]
notes    = "A gauge is a readout, not a control: its one value is always written beside the meter, so there is nothing a pointer or a key could move to. It takes no keyboard focus and answers no input. A slider sets a value, a tooltip explains a label the area had to cut, and a sparkline is where a value is read out of a history."
notes-tr = "Gösterge bir kontrol değil, bir okumadır: tek değeri her zaman ölçeğin yanında yazılıdır, yani imlecin ya da tuşun geçebileceği bir şey yoktur. Klavye odağı almaz, girdiye cevap vermez. Değeri kaydırıcı ayarlar, alanın kestiği etiketi ipucu balonu açar, geçmişten değer okumak da sparkline'ın işidir."

[[item]]
id       = "bar-chart"
name     = "Bar chart"
group    = "display"
kind     = "widget"
priority = "p3"
status   = "done"
page     = "bar-chart"
types    = ["Bar", "BarChart", "Series"]
notes    = "A chart of plain bars is the simple default; several series open through Series, stacked as segments of one bar or grouped as bars standing next to each other. Series tones come from the theme: its series-<n> colour tokens when it has them, otherwise a ramp from the accent towards the faint end, which repeats after four series. A horizontal segment writes its series name inside itself when the name fits, so a stack is never read by colour alone. Given on_select the chart answers the pointer and the keyboard: the touched category rises on a raised ground and a horizontal chart marks it with the pillar in cells kept free for it from the first frame, so nothing moves when something is hovered or selected. Series::tone pins a series to one tone of the palette, so a category keeps its colour from week to week however many categories each chart shows; a chart without tones draws exactly as before."
notes-tr = "Sade çubuklardan oluşan grafik en basit halidir; birden çok seri Series ile açılır: tek çubuğun payları olarak yığılabilir ya da yan yana duran çubuklar olarak gruplanabilir. Seri tonları temadan gelir: temanın series-<n> renk anahtarları varsa onlardan, yoksa vurgudan soluk uca giden bir merdivenden; merdiven dört seriden sonra başa döner. Yatay bir pay, adı sığdığında adını kendi içine yazar; böylece yığın hiçbir zaman yalnızca renkle okunmaz. on_select verildiğinde grafik fareyi ve klavyeyi yanıtlar: dokunulan kategori yükselen bir zemine oturur, yatay grafik onu ilk kareden beri boş tutulan hücredeki vurgu çubuğuyla işaretler; böylece hover ya da seçimde hiçbir şey yerinden oynamaz. Series::tone bir seriyi paletteki tek bir tona bağlar; böylece bir kategori, her grafik kaç kategori gösterirse göstersin haftadan haftaya rengini korur. Ton verilmeyen grafik bugünkü gibi çizilir."

[[item]]
id       = "heatmap"
name     = "Heatmap"
group    = "display"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "heatmap"
types    = ["Heatmap"]
notes    = "One cell per day, a column per week, the tone carrying the day's density. A day outside the range shows nothing at all while a day inside it that holds nothing takes the empty tone, so the two never look the same. A narrow area drops the oldest whole weeks and `columns` says how many are left, for a caller that writes \"the last 12 weeks\". The tone is one of four steps, not a gradient: a 16-colour terminal drops the steps it cannot tell apart instead of drawing two levels in one tone."
notes-tr = "Gün başına bir hücre, hafta başına bir sütun; ton o günün yoğunluğunu taşır. Aralığın dışındaki gün hiç çizilmez, içindeki boş gün ise boş tonunu alır; ikisi asla aynı görünmez. Dar alan en eski haftaları tam sütun olarak düşürür ve `columns` kaç haftanın kaldığını söyler, böylece çağıran \"son 12 hafta\" yazabilir. Ton sürekli bir geçiş değil dört kademedir: 16 renkli terminal ayırt edemediği kademeleri düşürür, iki seviyeyi tek tonda çizmez."

[[item]]
id       = "legend"
name     = "Legend"
group    = "display"
kind     = "widget"
priority = "p0"
status   = "done"
page     = "heatmap"
types    = ["Legend"]
notes    = "The names behind the series tones of a chart; the n-th name takes the theme's n-th series tone. The swatch is two cells of colour and no marker, so it reads the same in every glyph mode. tones pins every name to a fixed tone of the palette: a category given the same index through Series::tone and TimeBlock::tone keeps its colour from week to week however many categories show beside it. A legend given no tones draws exactly as before."
notes-tr = "Bir grafiğin seri tonlarının arkasındaki adlar; n'inci ad temanın n'inci seri tonunu alır. Örnek renk iki hücrelik renktir, işaret içermez; böylece her glif kipinde aynı okunur. tones ile her ad paletteki sabit bir tona bağlanır; Series::tone ve TimeBlock::tone ile aynı sayıyı alan kategori, yanında kaç kategori görünürse görünsün haftadan haftaya aynı rengi korur. tones verilmeyen gösterge bugünkü gibi çizilir."

[[item]]
id       = "timeline"
name     = "Timeline"
group    = "display"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "timeline"
types    = ["Timeline", "TimeBlock"]
notes    = "A day as a strip: blocks of colour where their hours fall, the empty track for the gaps. A block shorter than a cell still takes one. Two blocks of one tone that touch are parted by a quieter first cell on the later one, a seam of tone, never a line. Overlapping blocks stand in lanes: each takes the first lane from the top where nothing overlaps it, so a day of consecutive blocks is one row and a block running at the same time as another adds a row; an area shorter than the lanes folds the rest into its last row, later over earlier and the selected block always on top. Midnight: the day is 24 hours from day_starts_at (midnight by default), so a night-shift day from 18:00 holds 23:00–01:30 as one block; in a midnight day that block is cut at the day's end and its rest belongs to the next day's strip. A range is placed in the same day and kept inside it. Zoom is the caller's range: + and - step through 24, 12, 6, 3 and 1 hours around the selected block, 0 returns to the whole day, the wheel zooms around the pointer only while the timeline holds the focus so a page scrolled past it never gets caught, and selecting a block outside a zoomed range moves the range to it. A picture until on_select; then hover and selection step towards the text colour (rest < hover < selected < keyboard), ←/→ walk the blocks in time order and the readout row writes the block under the pointer or else the selected one, so both read the same words. It is a narrow strip, so it never slides and nothing shifts on hover or selection. Short areas give up the axis first, then the readout, then lanes. On few colours a tone that would merge with the track or its own step is pushed until it differs. Open edges and faint blocks: open_end and open_start mark an edge where the block does not really stop (a session past midnight, one carried over, a counter still running); the last or first two cells fade towards the track, two thirds and one third of the way, a tone transition and no glyph (the ▌ pillar means focus), always kept apart from the track so a block never looks shorter, and always leaving one cell of the block's tone. Only the block's own edge fades; a zoom cut stays square, since the range is where the view stops, not the block. The readout writes the meaning after the times: continues next day, running, from the previous day, from earlier. faint puts a block halfway between its tone and the track, for the next day's part of a session; hover and selection still step it, never onto the track."
notes-tr = "Bir gün şerit olarak: saatlerinin düştüğü yerde renk blokları, boşluklar için boş iz. Bir hücreden kısa blok yine bir hücre alır. Aynı tondaki iki bitişik blok, sonrakinin daha sakin ilk hücresiyle ayrılır: ton farkıyla, asla çizgiyle değil. Çakışan bloklar şeritlere dizilir: her blok üstten, kendisiyle çakışan bir şey olmayan ilk şeridi alır; art arda bloklardan oluşan gün tek satırdır, başka bir blokla aynı anda süren blok bir satır ekler. Şeritlerden kısa alan kalanları son satırına katlar: sonraki öncekinin üstüne, seçili blok her zaman en üste çizilir. Gece yarısı: gün day_starts_at'tan (varsayılanı gece yarısı) başlayan 24 saattir; 18.00'de başlayan bir gece vardiyası günü 23.00–01.30'u tek blok olarak tutar, gece yarısında başlayan günde ise bu blok günün sonunda kesilir ve kalanı ertesi günün şeridine aittir. Aralık da aynı güne yerleşir ve onun içinde tutulur. Yakınlaştırma çağıranın aralığıdır: + ve - seçili bloğun çevresinde 24, 12, 6, 3 ve 1 saat arasında adım atar, 0 bütün güne döner, tekerlek yalnızca şerit odaktayken imlecin çevresinde yakınlaştırır (böylece yanından kaydırılan sayfa ona takılmaz) ve yakın bir aralığın dışındaki blok seçilince aralık ona kayar. on_select verilene kadar resimdir; sonra üzerine gelinen ve seçilen blok metin rengine doğru adım atar (dinlenme < hover < seçili < klavye), ←/→ blokları zaman sırasıyla gezer ve okuma satırı imlecin altındaki bloğu, yoksa seçili olanı yazar; ikisi de aynı sözleri okur. Dar bir şerittir: asla kaymaz, üzerine gelince ya da seçince hiçbir şey yer değiştirmez. Kısa alan önce ekseni, sonra okuma satırını, en son şeritleri bırakır. Az renkli terminalde izle ya da kendi adımıyla birleşecek ton, ayrışana kadar itilir. Açık kenar ve soluk blok: open_end ve open_start bloğun gerçekte durmadığı kenarı işaretler (gece yarısını aşan, önceki günden gelen ya da hâlâ süren sayaç); son ya da ilk iki hücre ize doğru üçte iki ve üçte bir oranında solar. Bu bir ton geçişidir, glif değil (▌ çubuğu odak demektir); solan hücre izden hep ayrı kalır ki blok kısa görünmesin, bloğun tonunda hep bir hücre kalır. Yalnızca bloğun kendi kenarı solar; yakınlaştırma kesiği kare kalır, çünkü aralık görünümün bittiği yerdir, bloğun değil. Okuma satırı anlamı saatlerden sonra yazar: ertesi güne sürüyor, sürüyor, önceki günden, önceden. faint bloğu tonuyla iz arasında yarı yola koyar (oturumun ertesi gündeki parçası için); hover ve seçim onu yine adımlar, asla ize değil."

[[item]]
id       = "axis"
name     = "Axis"
group    = "display"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "timeline"
types    = ["Axis"]
notes    = "A row of labels along a chart's edge: hours placed by time with the same arithmetic as a timeline's blocks, weekdays, months or names of your own centred in equal slots shared out the way a vertical bar chart shares its width (gap matches the chart's gap). Names come from the language files. Thinning rule: weekdays and months write every name in full while all fit, then every name short, then the short name of every second, third, … one; hours take the finest round step that fits (15 and 30 minutes, 1, 2, 3, 4, 6, 12 hours, a day) in the long form 09:30, falling back to the short 09 only when the long one leaves fewer than two labels. At least one empty cell between labels; a label that would run past the edge is left out, never cut. It lives on the Timeline page because on its own it is a row of words; beside a chart it is what a reader looks at. BarChart does not use it yet: its vertical labels are cut with … and an axis would change how it draws."
notes-tr = "Grafiğin kenarı boyunca bir etiket satırı: saatler bir zaman şeridinin bloklarıyla aynı hesapla zamana göre yerleşir; gün adları, ay adları ya da kendi adların, dikey çubuk grafiğin genişliğini böldüğü gibi bölünen eşit yuvaların ortasına oturur (gap grafiğin boşluğuyla eşleşir). Adlar dil dosyalarından gelir. Seyreltme kuralı: gün ve ay adları hepsi sığdıkça tam, sonra hepsi kısa, sonra her ikinci, üçüncü… adın kısası; saatler sığan en ince yuvarlak adımı alır (15 ve 30 dakika, 1, 2, 3, 4, 6, 12 saat, bir gün) ve uzun biçimde (09:30) yazılır, uzun biçim ikiden az etiket bıraktığında kısa biçime (09) düşer. Etiketler arasında en az bir boş hücre kalır; kenardan taşacak etiket kesilmez, bırakılır. Zaman şeridi sayfasında durur, çünkü tek başına bir satır sözcüktür; bir grafiğin yanında okurun baktığı yerdir. BarChart onu henüz kullanmıyor: dikey etiketleri … ile kesilir ve eksen çizimini değiştirirdi."

[[item]]
id       = "big-text"
name     = "Big text"
group    = "display"
kind     = "widget"
priority = "p3"
status   = "done"
page     = "big-text"
types    = ["BigText", "Gradient"]
notes    = "The letters take one flat colour unless a gradient blends them into a second theme colour, across the columns or down the rows. Both ends are theme colours, so a logo changes with the theme; the blend is painted, never animated. It steps per cell, so a blend down the rows has three steps with Unicode and Nerd Font glyphs and five in ASCII mode. Where only the sixteen standard colours exist, or where the theme does not know the colour asked for, the text keeps its flat colour rather than speckling."
notes-tr = "Harfler tek düz renk alır; gradient açılırsa ikinci bir tema rengine doğru, sütunlar boyunca ya da satırlar boyunca karışır. Geçişin iki ucu da tema rengidir, yani logo temayla değişir; geçiş boyanır, asla oynatılmaz. Karışım hücre hücre ilerler: satır yönünde Unicode ve Nerd Font modunda üç, ASCII modunda beş adım olur. Yalnızca on altı rengin bulunduğu ya da temanın istenen rengi tanımadığı yerde metin benek benek olmak yerine düz rengini korur."

[[item]]
id       = "date-picker"
name     = "Date picker"
group    = "forms"
kind     = "widget"
priority = "p3"
status   = "done"
page     = "date-picker"
types    = ["DatePicker", "Date", "Weekday", "is_leap_year", "days_in_month"]
notes    = "One highlighted day, moved by keys and pointer alike, with three-cell month arrows; a click elsewhere closes the calendar and still reaches its target. The field, month arrows and highlighted day show the pillar in their blank leftmost cell, so nothing slides; the pillar breathes only under keyboard focus."
notes-tr = "Klavyenin de farenin de taşıdığı tek bir vurgulu gün ve üç hücrelik ay okları vardır; başka yere tıklamak takvimi kapatır ve tıklama hedefine yine ulaşır. Alan, ay okları ve vurgulu gün çubuğu en soldaki boş hücrelerinde gösterir, bu yüzden hiçbir şey kaymaz; çubuk yalnızca klavye odağında nefes alır."

[[item]]
id       = "time-input"
name     = "Time input"
group    = "forms"
kind     = "widget"
priority = "p3"
status   = "done"
page     = "time-input"
types    = ["TimeInput", "TimeOfDay"]
notes    = "The mouse wheel changes the segment under the pointer without a click; over a colon it changes the segment last hovered, or else the active one. ctrl a selects the whole time to copy or cut, pasting a time such as 9:30 sets it, and right click opens the edit menu."
notes-tr = "Fare tekerleği tıklamaya gerek kalmadan imlecin altındaki bölümü değiştirir; iki noktanın üzerindeyse en son üzerinden geçilen bölümü, yoksa etkin bölümü. ctrl a saatin tamamını kopyalamak ya da kesmek için seçer, 9:30 gibi bir saat yapıştırmak onu ayarlar, sağ tık düzenleme menüsünü açar."

[[item]]
id       = "duration-input"
name     = "Duration input"
group    = "forms"
kind     = "widget"
priority = "p1"
status   = "done"
page     = "duration-input"
types    = ["DurationInput", "DurationError", "DurationUnit", "parse_duration"]
notes    = "A length of time edited like the time input, segment by segment, with the unit words of the active language after the numbers: 1 h 30 min, 1 sa 30 dk. The wheel, the keys, pasting and the right-click menu work as in the time input, but a length does not wrap: a step carries between units, stops at zero and at 99 h 59 min 59 s, and 90 typed into the minutes reads 1 h 30 min. Pasting reads numbers with units in every known language, a clock face such as 2:15 (hours and minutes) or a bare number of minutes; a text it cannot read is ignored, or reported with the precise reason through on_reject. A zero length rests faint as the empty state, and where the words do not fit the field falls back to the clock form."
notes-tr = "Saat girişi gibi bölüm bölüm düzenlenen bir süre; sayılardan sonra etkin dilin birim sözcükleri gelir: 1 sa 30 dk, 1 h 30 min. Tekerlek, tuşlar, yapıştırma ve sağ tık menüsü saat girişindeki gibi çalışır, ama süre başa sarmaz: bir adım birimler arasında taşar, sıfırda ve 99 sa 59 dk 59 sn'de durur; dakikaya 90 yazmak 1 sa 30 dk olur. Yapıştırma, bilinen her dilde birimli sayıları, 2:15 gibi bir saat yüzünü (saat ve dakika) ya da çıplak dakika sayısını okur; okuyamadığı metin yok sayılır ya da on_reject ile tam sebebiyle bildirilir. Sıfır süre boş durum olarak soluk durur; sözcükler sığmayınca alan saat biçimine döner."

