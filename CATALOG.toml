notes    = "The code is selectable by default, but its padding never is. Clean copies leave line numbers out."
notes-tr = "Kod varsayılan olarak seçilebilir, iç boşluğu ise hiçbir zaman seçilmez. Temiz kopya satır numaralarını almaz."

[[item]]
