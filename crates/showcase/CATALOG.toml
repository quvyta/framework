[[item]]
id       = "keymap"
name     = "Keymap"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "focus-keys"
types    = ["Keymap", "Scope", "KeyChord", "Key", "Modifiers"]
notes    = "Actions are bound by name, in [global] for the framework and [app] for the application, and the map comes from a file or, with keymap_source, from text compiled into the binary. A broken entry is skipped with its file, line and column and the built-in bindings keep working, so a keymap that cannot be read never stops the program from starting. NodeMut::on_action(scope, action, msg) lets an action mean something else while focus is inside one node: the innermost answering node around the focused widget sends its message and App::action is not asked; with focus elsewhere the key reaches App::action as usual. The focus in force when the key arrives decides, whether it came by Tab, a click or Command::focus, so the application keeps no flag that a click could make wrong. Keys the focused widget uses stay with it and the runtime's own actions (quit, focus-next, copy and the rest) are never answered. A query in App::action was considered and left out: it needed a new argument on a method every application implements."
notes-tr = "Eylemler adla bağlanır: framework için [global], uygulama için [app]. Harita bir dosyadan ya da keymap_source ile ikiliye gömülü metinden gelir. Bozuk bir satır dosya, satır ve sütunuyla bildirilip atlanır, gömülü bağlamalar çalışmaya devam eder; okunamayan bir kısayol haritası programın açılmasını hiçbir zaman engellemez. NodeMut::on_action(kapsam, eylem, mesaj) bir eylemin, odak bir düğümün içindeyken başka bir anlama gelmesini sağlar: odaklı bileşeni saran ve cevap veren en içteki düğüm kendi mesajını gönderir, App::action'a sorulmaz; odak başka yerdeyken tuş her zamanki gibi App::action'a gider. Tuş geldiği andaki odak karar verir, odak Tab ile, tıklamayla ya da Command::focus ile gelmiş olabilir; böylece uygulama bir tıklamanın yanıltabileceği bir bayrak tutmaz. Odaklı bileşenin kullandığı tuşlar onda kalır, çalışma motorunun kendi eylemleri (quit, focus-next, copy ve diğerleri) hiç cevaplanmaz. App::action içinde bir sorgu da düşünüldü ve bırakıldı: her uygulamanın yazdığı bir metoda yeni bir argüman gerekiyordu."

