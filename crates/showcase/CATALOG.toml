[[item]]
id       = "keymap"
name     = "Keymap"
group    = "foundations"
kind     = "infrastructure"
priority = "p0"
status   = "done"
page     = "focus-keys"
types    = ["Keymap", "Scope", "KeyChord", "Key", "Modifiers"]
notes    = "Actions are bound by name, in [global] for the framework and [app] for the application, and the map comes from a file or, with keymap_source, from text compiled into the binary. A broken entry is skipped with its file, line and column and the built-in bindings keep working, so a keymap that cannot be read never stops the program from starting."
notes-tr = "Eylemler adla bağlanır: framework için [global], uygulama için [app]. Harita bir dosyadan ya da keymap_source ile ikiliye gömülü metinden gelir. Bozuk bir satır dosya, satır ve sütunuyla bildirilip atlanır, gömülü bağlamalar çalışmaya devam eder; okunamayan bir kısayol haritası programın açılmasını hiçbir zaman engellemez."

